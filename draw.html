, "yao": 3, "yaoLabel": "삼효", "headline": "기르는 도리를 거스르니, 곧아도 흉하다 — 십 년을 쓰지 마라.", "효사": "拂頤貞凶 十年勿用 无攸利", "효位": "하괘의 끝·부정 / 기름의 도를 크게 어긴 가장 흉한 자리", "연애": "탐욕·잘못된 의존으로 어긋났다. 곧으려 해도 흉하니 오래 멈춰라.", "직장": "잘못된 길로 크게 어긋났다. 한동안 손 떼고 자세를 다 바꿔라.", "학업": "나쁜 방식이 굳었다. 한동안 멈추고 처음부터 다시 잡아라.", "인간관계": "관계가 크게 어긋났다. 한동안 거리를 두고 다 비워라.", "금전": "잘못된 운용이 굳었다. 한동안 손 떼고 전면 재정비하라.", "건강": "나쁜 습관이 깊다. 한동안 끊고 근본부터 바꿔라."}, {"no": 27, "name": "山雷頤 (산뢰이)", "hexa": "䷚", "yao": 4, "yaoLabel": "사효", "headline": "거꾸로 길러도 길하니 — 범처럼 노려보며 쫓고 또 쫓으면 허물이 없다.", "효사": "顚頤 吉 虎視眈眈 其欲逐逐 无咎", "효位": "상괘의 시작 / 아래를 길러주되 간절함으로 추구해 허물이 없는 자리", "연애": "낮춰 베풀되 진심은 간절하게. 절실히 다가가면 허물이 없다.", "직장": "아랫사람을 키우되 목표는 집요하게 쫓아라. 그러면 무탈하다.", "학업": "남을 도우며 배우되 네 목표는 집요하게 추구하라. 무탈하다.", "인간관계": "베풀되 진심은 간절하게. 절실하면 허물이 없다.", "금전": "나누되 기회는 집요하게 노려라. 간절하면 무탈하다.", "건강": "여유 있게 하되 회복 의지는 간절하게. 그러면 무탈하다."}, {"no": 27, "name": "山雷頤 (산뢰이)", "hexa": "䷚", "yao": 5, "yaoLabel": "오효", "headline": "바른 길을 거스르나 — 곧게 머물면 길하니, 큰 강은 건너지 마라.", "효사": "拂經 居貞吉 不可涉大川", "효位": "임금의 자리이나 약함 / 곧게 머물되 큰 모험은 삼가는 자리", "연애": "지금은 곧게 지키며 머물러라. 큰 결단(고백·이별)은 미뤄라.", "직장": "곧게 자리를 지켜라. 큰 모험·전환은 지금 삼가라.", "학업": "곧게 지금을 다져라. 큰 도전은 지금 벌이지 마라.", "인간관계": "곧게 관계를 지켜라. 큰 결단은 지금 미뤄라.", "금전": "곧게 지키며 머물러라. 큰 투자·모험은 삼가라.", "건강": "곧게 관리를 유지하라. 큰 무리는 지금 삼가라."}, {"no": 27, "name": "山雷頤 (산뢰이)", "hexa": "䷚", "yao": 6, "yaoLabel": "육효", "headline": "기름의 근원이 되니, 위태롭게 여기면 길하고 큰 강을 건너도 이롭다.", "효사": "由頤 厲吉 利涉大川", "효位": "맨 위·끝 / 만물을 기르는 근원, 책임을 진 채 큰일을 해낼 자리", "연애": "네가 관계를 먹여 살리는 중심이다. 무겁게 여기되 큰 결단도 길하다.", "직장": "네가 사람을 기르는 자리다. 책임을 무겁게 지면 큰일도 이롭다.", "학업": "네가 기준을 세우는 자리다. 신중하면 큰 도전도 이롭다.", "인간관계": "네가 관계를 떠받치는 중심이다. 무겁게 여기면 큰일도 길하다.", "금전": "네가 흐름을 떠받친다. 신중하면 큰 투자도 이롭다.", "건강": "네가 관리의 중심이다. 신중하면 큰 전환도 이롭다."}, {"no": 28, "name": "澤風大過 (택풍대과)", "hexa": "䷛", "yao": 1, "yaoLabel": "초효", "headline": "흰 띠풀을 자리에 까니, 허물이 없다.", "효사": "藉用白茅 无咎", "효位": "맨 아래·시작 / 지나친 때일수록 지극히 신중한 자리", "연애": "큰 부담의 시작일수록 지극히 조심하라. 정성을 다하면 허물이 없다.", "직장": "벅찬 일의 출발일수록 신중하게. 지극히 조심하면 탈이 없다.", "학업": "버거운 과정의 시작, 기초 라 유연하게. 외고집은 경계하라.", "금전": "원칙 고수는 좋되, 시장이 바뀌면 조정하라. 맹신은 경계.", "건강": "꾸준함은 좋되, 안 맞는 방법은 바꿔라. 고집은 경계하라."}, {"no": 32, "name": "雷風恒 (뇌풍항)", "hexa": "䷟", "yao": 6, "yaoLabel": "육효", "headline": "항상됨에 떨치며 동요하니, 흉하다.", "효사": "振恒 凶", "효位": "맨 위·끝 / 꾸준해야 할 자리에서 들떠 흔들리는 자리", "연애": "안정돼야 할 때 자꾸 흔들고 들쑤시면 흉하다. 차분히 지켜라.", "직장": "꾸준해야 할 때 들떠 흔들면 흉하다. 안정을 지켜라.", "학업": "다잡아야 할 때 들떠 산만하면 흉하다. 차분히 지속하라.", "인간관계": "안정돼야 할 관계를 자꾸 흔들면 흉하다. 차분히 지켜라.", "금전": "지켜야 할 때 들떠 흔들면 흉하다. 차분히 유지하라.", "건강": "안정돼야 할 때 들떠 무리하면 흉하다. 차분히 지켜라."}, {"no": 33, "name": "天山遯 (천산둔)", "hexa": "䷠", "yao": 1, "yaoLabel": "초효", "headline": "물러남의 꼬리라 위태로우니, 갈 바를 두지 마라.", "효사": "遯尾 厲 勿用有攸往", "효位": "맨 아래·시작 / 물러날 때 맨 뒤에 처져 위태로운 자리", "연애": "물러설 때 꾸물대면 위태롭다. 끝내려면 깔끔히, 새 일은 벌이지 마라.", "직장": "발 뺄 때 늑장 부리면 위험하다. 지금은 새 일을 벌이지 마라.", "학업": "그만둘 건 빨리 정리하라. 어정쩡하게 끌면 위태롭다.", "인간관계": "거리 둘 사람과 미적대면 위태롭다. 새 관계도 지금은 미뤄라.", "금전": "뺄 자리에서 늑장 부리면 위험하다. 새 진입은 하지 마라.", "건강": "쉬어야 할 때 미적대면 위태롭다. 새 무리는 벌이지 마라."}, {"no": 33, "name": "天山遯 (천산둔)", "hexa": "䷠", "yao": 2, "yaoLabel": "이효", "headline": "누런 소가죽으로 단단히 묶으니, 아무도 풀지 못한다.", "효사": "執之用黃牛之革 莫之勝說", "효位": "신하의 中正 / 굳은 뜻으로 흔들림 없이 지키는 자리", "연애": "한번 정한 마음은 누가 흔들어도 굳게 지켜라. 단단함이 답이다.", "직장": "정한 방침은 흔들리지 말고 굳게 지켜라. 단단함이 신뢰를 준다.", "학업": "정한 계획은 누가 뭐래도 굳게 지켜라. 흔들림 없는 게 답이다.", "인간관계": "정한 거리·선은 굳게 지켜라. 누가 흔들어도 흔들리지 마라.", "금전": "정한 원칙은 굳게 지켜라. 시장이 흔들어도 흔들리지 마라.", "건강": "정한 관리는 굳게 지켜라. 유혹이 와도 흔들리지 마라."}, {"no": 33, "name": "天山遯 (천산둔)", "hexa": "䷠", "yao": 3, "yaoLabel": "삼효", "headline": "얽매여 물러나니 — 병들어 위태로우나, 사람을 기르듯 하면 길하다.", "효사": "係遯 有疾厲 畜臣妾吉", "효位": "하괘의 끝·위태 / 정에 매여 물러나지 못해 괴로운 자리", "연애": "미련에 매여 못 끊으면 괴롭다. 큰 결단은 미루되 곁의 작은 정은 챙겨라.", "직장": "정·이해에 얽매여 못 빠진다. 큰 발 빼기는 미루되 작은 일은 챙겨라.", "학업": "미련에 매여 못 끊으면 힘들다. 큰 전환은 미루고 할 수 있는 것부터.", "인간관계": "정에 얽매여 못 끊으면 괴롭다. 곁의 작은 관계부터 챙기며 버텨라.", "금전": "미련에 매여 손절 못 하면 괴롭다. 작게라도 정리부터 시작하라.", "건강": "무리에 매여 못 쉬면 탈난다. 큰 무리는 줄이고 작은 관리부터."}, {"no": 33, "name": "天山遯 (천산둔)", "hexa": "䷠", "yao": 4, "yaoLabel": "사효", "headline": "좋아하면서도 물러나니 — 군자는 길하고 소인은 그렇지 못하다.", "효 태롭다. 숫양이 울타리를 받아 뿔이 걸린다.", "효사": "小人用壯 君子用罔 貞厲 羝羊觸藩 羸其角", "효位": "하괘의 끝·위태 / 힘을 함부로 써서 도리어 갇히는 자리", "연애": "힘으로 밀어붙이면 도리어 걸려 곤란해진다. 함부로 들이받지 마라.", "직장": "힘으로 강행하면 울타리에 뿔 걸리듯 곤란해진다. 무리한 돌파는 마라.", "학업": "힘으로만 밀면 막힌다. 무리한 강행보다 지혜롭게 풀어라.", "인간관계": "힘으로 몰아붙이면 관계가 걸린다. 들이받지 마라.", "금전": "힘으로 밀어붙인 매매는 걸린다. 무리한 돌파는 마라.", "건강": "힘으로 밀어붙이면 몸이 걸린다. 무리한 강행은 마라."}, {"no": 34, "name": "雷天大壯 (뇌천대장)", "hexa": "䷡", "yao": 4, "yaoLabel": "사효", "headline": "곧으면 길하여 후회가 사라진다 — 울타리가 열려 걸림이 없으니, 큰 수레의 바퀴살에 힘쓴다.", "효사": "貞吉悔亡 藩決不羸 壯于大輿之輹", "효位": "상괘의 시작 / 막힘이 트여 힘차게 나아가는 자리", "연애": "막혔던 게 트인다. 곧게 나아가면 후회 없이 길하다.", "직장": "걸림이 풀린다. 곧게 추진하면 후회 없이 길하다.", "학업": "막혔던 진도가 트인다. 곧게 나아가면 길하다.", "인간관계": "막혔던 관계가 트인다. 곧게 다가가면 길하다.", "금전": "막혔던 흐름이 트인다. 곧게 가면 후회 없이 길하다.", "건강": "막혔던 회복이 트인다. 곧게 가면 길하다."}, {"no": 34, "name": "雷天大壯 (뇌천대장)", "hexa": "䷡", "yao": 5, "yaoLabel": "오효", "headline": "양을 평탄하게 잃으니, 후회가 없다.", "효사": "喪羊于易 无悔", "효位": "임금의 자리·中 / 고집스러운 힘을 부드럽게 내려놓는 자리", "연애": "고집스러운 기세를 부드럽게 내려놓아라. 힘을 빼면 후회가 없다.", "직장": "강하게 밀던 걸 부드럽게 풀어라. 힘을 빼면 후회가 없다.", "학업": "무리한 욕심을 부드럽게 놓아라. 힘을 빼면 후회가 없다.", "인간관계": "강한 고집을 부드럽게 내려놓아라. 후회가 없다.", "금전": "무리한 포지션을 부드럽게 줄여라. 후회가 없다.", "건강": "과한 운동을 부드럽게 줄여라. 후회가 없다."}, {"no": 34, "name": "雷天大壯 (뇌천대장)", "hexa": "䷡", "yao": 6, "yaoLabel": "육효", "headline": "숫양이 울타리를 받아 물러나지도 나아가지도 못하니 — 이로울 게 없으나, 어렵게 여기면 길하다.", "효사": "羝羊觸藩 不能退不能遂 无攸利 艱則吉", "효位": "맨 위·끝 / 힘이 다해 진퇴양난이나 신중하면 길한 자리", "연애": "고집으로 들이받다 오도 가도 못한다. 신중히 풀면 그래도 길하다.", "직장": "무리하게 밀다 진퇴양난이다. 어렵게 여기고 신중히 풀면 길하다.", "학업": "무리하게 밀다 막혔다. 조급함을 버리고 신중히 풀면 길하다.", "인간관계": "고집으로 들이받다 막혔다. 신중히 물러서면 길하다.", "금전": "무리한 베팅에 묶였다. 신중히 정리하면 그래도 길하다.", "건강": "무리하다 진퇴양난이다. 신중히 풀고 쉬면 길하다."}, {"no": 35, "name": "火地晉 (화지진)", "hexa": "䷢", "yao": 1, "yaoLabel": "초효", "headline": "나아가다 꺾이나 — 곧으면 길하고, 믿음 못 받아도 너그러우면 허물이 없다.", "효사": "晉如摧如 貞吉 罔孚 裕无咎", "효位": "맨 아래·시작 / 나아가려다 막혀도 곧고 너그러우면 무탈한 자리", "연애": "다가가다 거절당해도 곧고 너그러우면 허물이 없다. 조급해 말라.", "직장": "추진하다 막혀도 곧게, 인정 못 받아도 너그러우면 무탈하다.", "학업": "나아가다 막혀도 곧게, 결과 늦어도 너그러우면 무탈하다.", "인간관계": "다가가다 밀려도 곧고 )", "hexa": "䷦", "yao": 5, "yaoLabel": "오효", "headline": "크게 어려운 때, 벗이 온다.", "효사": "大蹇 朋來", "효位": "임금의 자리·中正 / 가장 큰 난관에 동지가 모여드는 자리", "연애": "가장 힘든 때, 진짜 곁을 지키는 사람이 나타난다. 그 인연을 붙들어라.", "직장": "가장 어려운 때, 함께할 동지가 모인다. 그 힘으로 버텨라.", "학업": "가장 막막한 때, 도와줄 사람·기회가 온다. 그 힘으로 넘어라.", "인간관계": "가장 힘든 때, 진짜 벗이 나타난다. 그 인연을 소중히 하라.", "금전": "가장 어려운 때, 믿을 조력이 온다. 그 힘으로 버텨라.", "건강": "가장 힘든 때, 도와줄 손길이 온다. 그 힘으로 회복하라."}, {"no": 39, "name": "水山蹇 (수산건)", "hexa": "䷦", "yao": 6, "yaoLabel": "육효", "headline": "나아가면 어렵고 돌아오면 크니 — 길하여, 대인을 만남이 이롭다.", "효사": "往蹇 來碩 吉 利見大人", "효位": "맨 위·끝 / 돌아와 크게 이루고 귀인을 만나는 자리", "연애": "더 매달리기보다 돌아오면 크게 얻는다. 좋은 사람을 만나면 더 길하다.", "직장": "더 나아가기보다 돌아오면 크게 이룬다. 귀인을 만나면 길하다.", "학업": "더 무리하기보다 돌아와 다지면 크게 이룬다. 좋은 스승이 길하다.", "인간관계": "더 다가가기보다 돌아오면 크게 얻는다. 좋은 사람이 길하다.", "금전": "더 가기보다 돌아오면 크게 얻는다. 좋은 조력자가 길하다.", "건강": "더 무리하기보다 돌아와 다지면 크게 회복한다. 좋은 전문가가 길하다."}, {"no": 40, "name": "雷水解 (뇌수해)", "hexa": "䷧", "yao": 1, "yaoLabel": "초효", "headline": "막 풀리기 시작했다 — 서둘러 손대지 마라.", "효사": "无咎", "효位": "막 풀림의 시작 / 긴장이 풀리는 첫 순간", "연애": "막 풀리려는 기류, 먼저 휘젓지 마라. 가만 두면 저절로 가벼워진다.", "직장": "긴장이 막 풀리는 참이다. 서둘러 일을 벌이기보다 한숨 돌려도 허물이 없다.", "학업": "한 고비 넘겼으니 곧장 다음으로 안 달려도 된다. 잠깐의 멈춤이 회복이다.", "인간관계": "얽힌 게 풀리기 시작했다. 들쑤시지 말고 두면 매끄러워진다.", "금전": "급한 불은 꺼졌다. 바로 다음 판을 벌이기보다 숨을 고를 때.", "건강": "긴장이 풀리는 회복기. 다시 몰아붙이지 마라, 쉬는 게 약이다."}, {"no": 40, "name": "雷水解 (뇌수해)", "hexa": "䷧", "yao": 2, "yaoLabel": "이효", "headline": "쳐낼 것을 쳐내야, 곧은 길이 드러난다.", "효사": "田獲三狐 得黃矢 貞吉", "효位": "세 여우(잔꾀·소인)를 잡고 黃矢(中正)를 얻음", "연애": "달콤한 말이나 밀당에 휘둘리지 마라. 꾸밈을 걷어내고 곧게 다가갈 때 통한다. 진심과 잔재주가 오늘 갈린다.", "직장": "일을 복잡하게 만드는 잔꾀와 뒷말부터 정리하라. 곁가지를 쳐내고 핵심만 남기면 판단이 단숨에 분명해진다.", "학업": "요령과 꼼수부터 걷어내라. 정공법으로 곧게 파고들 때 머리가 맑아진다.", "인간관계": "듣기 좋은 말만 하는 사람을 가려낼 때다. 누가 진짜고 누가 여우인지 드러난다.", "금전": "빨리 불려준다는 솔깃한 제안일수록 의심하라. 영리한 한 수보다 곧게 둔 자리가 끝까지 남는다.", "건강": "몸에 안 맞는 군더더기 습관부터 끊어라. 곧게 정돈하면 컨디션이 잡힌다."}, {"no": 40, "name": "雷水解 (뇌수해)", "hexa": "䷧", "yao": 3, "yaoLabel": "삼효", "headline": "분수에 없는 자리는, 도둑을 부른다.", "효사": "負且乘 致寇至 貞吝", "효位": "짐꾼이 수레를 탐 / 분수를 넘어 화를 부르는 자리", "연애": "가진 것 이상으로 꾸며 보이면 엉뚱한 사람이 꼬인다. 과시가 화근이다.", "직장": "능력 이상의 자리를 욕심내면 시샘과 견제를 부른다. 짐과 수레가 안 맞으면 탈이 난다.", "학업": "실력보다 성과를 부풀려 내세우면 곧 들통난다. 보이는 것보다 속을 채워라.", "인간관계": "없는 걸 있는 척 내보이면 노리는 자가 붙는다. 과장이 빈틈을 만든다.", "금전": "분수에 안 맞는 소비·과시는 손실과 사기를 부른다. 가진 만큼만 드러내라.", "건강": "몸 상태 이상으로 무리해 밀어붙이면 탈이 난다. 능력 밖을 욕심내지 마라."}, {"no": 40, "name": "雷水解 (뇌수해)", "hexa": "䷧", "yao": 4, "yaoLabel": "사효", "headline": "들러붙은 것을 떼어내야, 진짜가 온다.", "효사": "解而拇 朋至斯孚", "효位": "엄지에 붙은 것을 풂 / 떼어내야 믿을 벗이 옴", "연애": "미련처럼 들러붙은 인연을 놓아라. 그 자리를 비워야 진심인 사람이 들어온다.", "직장": "발목 잡는 묵은 관계·일을 끊어내라. 정리하면 믿을 동료가 다가온다.", "학업": "붙들고 있던 비효율 습관을 떼어내라. 군더더기를 버리면 진짜 실력이 붙는다.", "인간관계": "끈적하게 달라붙은 사람을 정리할 때. 비우면 신의 있는 벗이 온다.", "금전": "질질 끌던 부실한 자산을 끊어라. 정리한 자리에 건강한 기회가 온다.", "건강": "끊지 못한 작은 나쁜 습관부터 떼어내라. 하나 끊으면 나머지가 따라 풀린다."}, {"no": 40, "name": "雷水解 (뇌수해)", "hexa": "䷧", "yao": 5, "yaoLabel": "오효", "headline": "내가 끊으면, 잔챙이는 알아서 물러난다.", "효사": "君子維有解 吉 有孚于小人", "효位": "군자가 풀어냄 / 단호함이 소인을 스스로 물러나게 함", "연애": "네가 중심을 곧게 세우면, 흔들던 사람은 스스로 떨어져 나간다. 길하다.", "직장": "단호히 정리하면 잔꾀 부리던 자들이 알아서 물러난다. 그 결단이 길하다.", "학업": "공부의 중심을 잡으면 산만하게 끌던 유혹이 힘을 잃는다. 흔들림이 사라진다.", "인간관계": "네가 분명히 선을 그으면 여우 같은 사람은 제풀에 멀어진다. 그게 증거다.", "금전": "원칙을 곧게 지키면 사기성 제안은 저절로 떨어진다. 단호함이 길하다.", "건강": "절제를 확실히 하면 나쁜 습관은 힘을 잃는다. 결심이 흐트러짐을 몰아낸다."}, {"no": 40, "name": "雷水解 (뇌수해)", "hexa": "䷧", "yao": 6, "yaoLabel": "육효", "headline": "마지막 매듭은, 망설임 없이 끊어라.", "효사": "公用射隼于高墉之上 獲之 无不利", "효位": "높은 담 위의 매를 쏘아 잡음 / 정점의 매듭을 끊는 자리", "연애": "오래 끌던 관계의 마지막 결단을 내릴 때. 망설이지 않고 매듭지으면 막힘이 없다.", "직장": "가장 높이 박힌 골칫거리를 정조준할 때. 준비됐다면 단번에 끝내라.", "학업": "미뤄둔 가장 어려운 과제를 정면으로 친다. 때를 노려 한 번에 끝내면 거칠 게 없다.", "인간관계": "묵은 갈등의 정점을 정면으로 풀 때. 정확히 겨눠 끝내면 뒤탈이 없다.", "금전": "오래 발목 잡던 큰 문제를 결단해 정리할 때. 준비된 한 수면 손해 볼 게 없다.", "건강": "미뤄온 큰 검진·치료를 결행할 때. 때를 놓치지 않으면 두루 이롭다."}, {"no": 41, "name": "山澤損 (산택손)", "hexa": "䷨", "yao": 1, "yaoLabel": "초효", "headline": "일을 마치면 빨리 떠나야 허물이 없으니 — 덜어낼 것을 헤아려라.", "효사": "已事遄往 无咎 酌損之", "효位": "맨 아래·시작 / 제 것을 덜어 도우되 분수를 헤아리는 자리", "연애": "도울 일을 마쳤으면 머물지 마라. 베풀되 네 분수껏 덜어라.", "직장": "맡은 걸 끝냈으면 빨리 물러서라. 돕되 네 여력을 헤아려라.", "학업": "할 몫을 끝냈으면 미련 두지 마라. 덜어낼 건 정도껏.", "인간관계": "도움을 줬으면 생색 말고 떠나라. 베풀되 분수껏.", "금전": "도울 만큼 했으면 멈춰라. 덜어내되 네 여력을 헤아려라.", "건강": "무리한 것부터 빨리 덜어내라. 단 정도껏 줄여라."}, {"no": 41, "name": "山澤損 (산택손)", "hexa": "䷨", "yao": 2, "yaoLabel": "이효", "headline": "곧으면 이롭고 나아가면 흉하니 — 덜지 않아도 보탠다.", "효사": "利貞 征凶 弗損益之", "효位": "신하의 中正 / 무리하게 덜지 말고 곧음을 지켜 보태는 자리", "연애": "억지로 다 맞춰주지 마라. 곧게 네 자리를 지키는 게 오히려 관계를 살린다.", "직장": "무리하게 다 내주지 마라. 곧게 본분을 지키는 게 더 도움이 된다.", "학업": "다 깎아내며 무리 말고 곧게 지켜라. 안 덜어도 보탬이 된다.", "인간관계": "다 맞춰주려 무리 마라. 곧게 지키는 게 관계를 살린다.", "금전": "무리하게 다 투입 마라. 곧게 지키는 게 오히려 이롭다.", "건강": "무리하게 다 쥐어짜지 마라. 곧게 지키는 게 보탬이 된다."}, {"no": 41, "name": "山澤損 (산택손)", "hexa": "䷨", "yao": 3, "yaoLabel": "삼효", "headline": "셋이 가면 하나를 덜고, 하나가 가면 벗을 얻는다.", "효사": "三人行則損一人 一人行則得其友", "효位": "하괘의 끝 / 군더더기를 덜어내야 진짜 짝을 얻는 자리", "연애": "셋이 얽히면 하나가 빠진다. 곁가지를 정리해야 진짜 한 사람을 얻는다.", "직장": "사공이 많으면 하나는 덜린다. 군더더기를 정리해야 핵심 파트너가 선다.", "학업": "이것저것 벌이면 하나는 놓친다. 덜어내 하나에 집중하면 얻는다.", "인간관계": "셋이 얽히면 하나가 빠진다. 곁가지를 덜어야 진짜 벗을 얻는다.", "금전": "여기저기 분산하면 하나는 잃는다. 덜어내 집중하면 얻는다.", "건강": "이것저것 손대면 하나는 놓친다. 덜어내 하나에 집중하라."}, {"no": 41, "name": "山澤損 (산택손)", "hexa": "䷨", "yao": 4, "yaoLabel": "사효", "headline": "그 병을 덜어내되 빨리 하면, 기쁨이 있어 허물이 없다.", "효사": "損其疾 使遄有喜 无咎", "효位": "상괘의 시작 / 결점·병폐를 빨리 덜어내 기쁜 자리", "연애": "관계의 군더더기·나쁜 버릇을 빨리 덜어라. 빠를수록 기쁨이 온다.", "직장": "일의 비효율·병폐를 빨리 덜어내라. 빠를수록 기쁨이 온다.", "학업": "나쁜 공부 습관을 빨리 덜어내라. 빠를수록 효과가 온다.", "인간관계": "관계의 응어리를 빨리 덜어내라. 빠를수록 기쁨이 온다.", "금전": "부실·악성을 빨리 덜어내라. 빠를수록 회복이 빠르다.", "건강": "나쁜 습관·증상을 빨리 덜어내라. 빠를수록 좋아진다."}, {"no": 41, "name": "山澤損 (산택손)", "hexa": "䷨", "yao": 5, "yaoLabel": "오효", "headline": "혹 거북 열 쌍의 값으로도 어길 수 없으니, 크게 길하다.", "효사": "或益之十朋之龜 弗克違 元吉", "효位": "임금의 자리·中正 / 진심에 큰 도움이 절로 따라와 크게 길한 자리", "연애": "진심으로 덜고 베푸니 뜻밖의 큰 보답이 온다. 거스를 수 없이 크게 길하다.", "직장": "사심 없이 내주니 큰 도움이 절로 온다. 막을 수 없이 크게 길하다.", "학업": "성실히 비우니 뜻밖의 큰 도움이 온다. 크게 길하다.", "인간관계": "진심으로 베푸니 큰 인연·도움이 온다. 크게 길하다.", "금전": "원칙대로 비우니 뜻밖의 큰 기회가 온다. 크게 길하다.", "건강": "꾸준히 비우니 뜻밖의 큰 회복이 온다. 크게 길하다."}, {"no": 41, "name": "山澤損 (산택손)", "hexa": "䷨", "yao": 6, "yaoLabel": "육효", "headline": "덜지 않고 보태니 허물이 없고 곧으면 길하다 — 나아갈 바가 있어 신하를 얻되 가문은 없다.", "효사": "弗損益之 无咎 貞吉 利有攸往 得臣无家", "효位": "맨 위·끝 / 자기를 덜지 않고도 두루 보태는 가장 좋은 자리", "연애": "이제 네 것을 깎지 않고도 베풀 수 있다. 곧게 나아가면 사람을 두루 얻는다.", "직장": "이제 무리 없이 두루 보탤 수 있다. 곧게 나아가면 사람이 따른다.", "학업": "이제 깎지 않고도 채울 수 있다. 곧게 나아가면 두루 이롭다.", "인간관계": "이제 손해 없이 두루 베풀 수 있다. 곧게 가면 사람을 얻는다.", "금전": "이제 무리 없이 두루 보탤 수 있다. 곧게 나아가면 이롭다.", "건강": "이제 무리 없이 두루 채울 수 있다. 곧게 가면 이롭다."}, {"no": 42, "name": "風雷益 (풍뢰익)", "hexa": "䷩", "yao": 1, "yaoLabel": "초효", "headline": "큰일을 일으킴이 이로우니, 크게 길하여 허물이 없다.", "효사": "利用為大作 元吉 无咎", "효位": "맨 아래·시작 / 보탬을 받아 큰일을 벌이기 좋은 자리", "연애": "기운이 보태진다. 마음을 크게 내어 다가가라. 크게 길하다.", "직장": "지원이 따른다. 큰일을 벌이기 좋은 때다. 크게 길하다.", "학업": "여건이 받쳐준다. 큰 목표에 도전하기 좋은 때다. 크게 길하다.", "인간관계": "도움이 모인다. 관계를 크게 넓히기 좋은 때다. 크게 길하다.", "금전": "흐름이 받쳐준다. 큰 운용을 벌이기 좋은 때다. 크게 길하다.", "건강": "기운이 보태진다. 큰 목표를 세우기 좋은 때다. 크게 길하다."}, {"no": 42, "name": "風雷益 (풍뢰익)", "hexa": "䷩", "yao": 2, "yaoLabel": "이효", "headline": "혹 거북 열 쌍의 값으로도 어길 수 없으니 — 길이 곧으면 길하다.", "효사": "或益之十朋之龜 弗克違 永貞吉", "효位": "신하의 中正 / 진심에 큰 도움이 따르니 오래 곧으면 길한 자리", "연애": "진심에 뜻밖의 큰 도움이 온다. 그 마음을 오래 곧게 지키면 길하다.", "직장": "성실함에 큰 지원이 온다. 그 자세를 오래 지키면 길하다.", "학업": "꾸준함에 뜻밖의 도움이 온다. 오래 곧게 가면 길하다.", "인간관계": "진심에 좋은 인연이 온다. 오래 곧게 지키면 길하다.", "금전": "원칙에 큰 기회가 온다. 오래 곧게 지키면 길하다.", "건강": "꾸준함에 뜻밖의 회복이 온다. 오래 지키면 길하다."}, {"no": 42, "name": "風雷益 (풍뢰익)", "hexa": "䷩", "yao": 3, "yaoLabel": "삼효", "headline": "흉한 일에 보태니 허물이 없으나 — 믿음을 갖고 중도로 행하며 공에게 알려야 한다.", "효사": "益之用凶事 无咎 有孚中行 告公用圭", "효位": "하괘의 끝·위태 / 위기에 보탬을 써도 진실과 절차를 지켜야 하는 자리", "연애": "위기일수록 진심으로 돕되 떳떳하게 하라. 숨기지 않으면 허물이 없다.", "직장": "위기에 자원을 투입하되 신뢰·절차를 지켜라. 투명하면 허물이 없다.", "학업": "위급할 때 자원을 쏟되 정도를 지켜라. 떳떳하면 무탈하다.", "인간관계": "위기에 도움을 주되 진심과 투명함을 지켜라. 그러면 무탈하다.", "금전": "위기에 자금을 투입하되 근거·절차를 지켜라. 투명하면 무탈하다.", "건강": "위급할 때 적극 대응하되 검증된 방법으로. 그러면 무탈하다."}, {"no": 42, "name": "風雷益 (풍뢰익)", "hexa": "䷩", "yao": 4, "yaoLabel": "사효", "headline": "중도로 행하여 공에게 고하면 따르니 — 의지해 나라를 옮김이 이롭다.", "효사": "中行 告公從 利用為依遷國", "효位": "상괘의 시작 / 중도를 지켜 애": "빛을 안으로 머금고 때를 기다려라. 진심을 지키면 뜻밖의 복이 온다.", "직장": "능력을 드러내지 말고 때를 기다려라. 묵묵하면 뜻밖의 기회가 온다.", "학업": "실력을 머금고 때를 기다려라. 묵묵하면 뜻밖의 결실이 온다.", "인간관계": "진심을 머금고 때를 기다려라. 묵묵하면 뜻밖의 인연이 온다.", "금전": "여력을 머금고 때를 기다려라. 묵묵하면 뜻밖의 기회가 온다.", "건강": "기운을 안으로 머금고 기다려라. 꾸준하면 뜻밖의 회복이 온다."}, {"no": 44, "name": "天風姤 (천풍구)", "hexa": "䷫", "yao": 6, "yaoLabel": "육효", "headline": "그 뿔에서 만나니 부끄러우나, 허물은 없다.", "효사": "姤其角 吝 无咎", "효位": "맨 위·끝 / 너무 높이 올라 외떨어져 부끄러우나 무탈한 자리", "연애": "너무 도도해 외떨어졌다. 멀어져 아쉬워도 큰 탈은 없다. 다음을 기약하라.", "직장": "너무 뻣뻣해 고립됐다. 아쉬워도 큰 허물은 없다. 자세를 낮춰라.", "학업": "너무 외길로 외떨어졌다. 아쉬워도 큰 탈은 없다. 시야를 넓혀라.", "인간관계": "너무 도도해 멀어졌다. 아쉬워도 큰 허물은 없다. 낮춰 다가가라.", "금전": "너무 높이 봐 기회를 놓쳤다. 아쉬워도 큰 탈은 없다.", "건강": "너무 욕심내 외떨어졌다. 아쉬워도 큰 탈은 없다. 낮춰라."}, {"no": 45, "name": "澤地萃 (택지췌)", "hexa": "䷬", "yao": 1, "yaoLabel": "초효", "headline": "믿음을 두나 끝까지 못 가 — 어지러이 모이니, 부르짖으면 한 줌 웃음거리가 되나, 가면 허물이 없다.", "효사": "有孚不終 乃亂乃萃 若號 一握為笑 勿恤 往无咎", "효位": "맨 아래·시작 / 마음이 흔들려 모임이 어지러우나 진심으로 나아가면 무탈한 자리", "연애": "마음이 흔들려 어수선하다. 망설임을 접고 진심으로 다가가면 무탈하다.", "직장": "갈피를 못 잡아 어수선하다. 머뭇대지 말고 합류하면 무탈하다.", "학업": "마음이 흔들려 산만하다. 망설임을 접고 모이면 무탈하다.", "인간관계": "마음이 흔들려 어수선하다. 망설임 접고 다가가면 무탈하다.", "금전": "갈피를 못 잡아 어수선하다. 망설임 접고 참여하면 무탈하다.", "건강": "마음이 흔들려 산만하다. 망설임을 접고 챙기면 무탈하다."}, {"no": 45, "name": "澤地萃 (택지췌)", "hexa": "䷬", "yao": 2, "yaoLabel": "이효", "headline": "이끌리면 길하여 허물이 없으니 — 진실하면, 작은 정성으로도 이롭다.", "효사": "引吉 无咎 孚乃利用禴", "효位": "신하의 中正 / 진실하면 작은 정성으로도 통하는 자리", "연애": "진실하면 화려한 표현 없이도 통한다. 끌리는 인연에 진심을 다하라.", "직장": "진실하면 큰 형식 없이도 통한다. 좋은 모임에 진심으로 합류하라.", "학업": "진실하면 거창한 것 없이도 통한다. 좋은 그룹에 진심으로 들어가라.", "인간관계": "진실하면 작은 정성으로도 통한다. 끌리는 인연에 진심을 다하라.", "금전": "진실하면 큰 자본 없이도 통한다. 좋은 흐름에 진심으로 참여하라.", "건강": "진실하면 거창한 것 없이도 통한다. 작은 정성으로 꾸준히."}, {"no": 45, "name": "澤地萃 (택지췌)", "hexa": "䷬", "yao": 3, "yaoLabel": "삼효", "headline": "모이려다 탄식하니 이로울 게 없으나 — 가면 허물이 없고, 조금 부끄럽다.", "효사": "萃如嗟如 无攸利 往无咎 小吝", "효位": "하괘의 끝·부정 / 끼지 못해 탄식하나 나아가면 무탈한 자리", "연애": "끼지 못해 서운해도 먼저 다가가라. 조금 머쓱해도 가면 무탈하다.", "직장": "어울리지 못해 아쉬워도 먼저 다가가라. 조금 어색해도 무탈하다.", "학업": "그룹에 못 껴 아쉬워도 먼저 다가가라. 조금 머쓱해도 무탈하다.", "인간관계": "끼지 못해 서운해도 먼저 손 내밀어라. 조금 머쓱해도 무탈하다.", "금전": "흐름에 못 껴 아쉬워도 늦게라도 참여하라. 조금 손해여도 무탈.", "건강": "함께 못 해 아쉬워도 먼저 합류하라. 조금 머쓱해도 무탈하다."}, {"no": 45, "name": "澤地萃 (택지췌)", "hexa": "䷬", "yao": 4, "yaoLabel": "사효", "headline": "크게 길하여, 허물이 없다.", "효사": "大吉 无咎", "효位": "상괘의 시작 / 사심 없이 사람을 모아 크게 길한 자리", "연애": "사심 없이 사람을 모으면 크게 길하다. 진심으로 곁을 채워라.", "직장": "사심 없이 사람을 모으면 크게 길하다. 공정하면 무탈하다.", "학업": "좋은 사람들을 모아 함께 가면 크게 길하다.", "인간관계": "사심 없이 사람을 모으면 크게 길하다. 진심으로 채워라.", "금전": "건실하게 함께 모으면 크게 길하다. 공정하면 무탈하다.", "건강": "좋은 사람들과 함께 관리하면 크게 길하다."}, {"no": 45, "name": "澤地萃 (택지췌)", "hexa": "䷬", "yao": 5, "yaoLabel": "오효", "headline": "모임에 자리가 있으니 허물이 없으나 — 믿지 않는 이는, 크게 오래 곧으면 후회가 사라진다.", "효사": "萃有位 无咎 匪孚 元永貞 悔亡", "효位": "임금의 자리·中正 / 중심에서 사람을 모으되 신뢰를 쌓아야 하는 자리", "연애": "중심에 섰어도 아직 안 따르는 마음이 있다. 오래 곧게 진심을 보이면 풀린다.", "직장": "자리는 얻었어도 아직 신뢰가 덜하다. 오래 곧게 가면 후회가 없다.", "학업": "위치는 잡았어도 아직 부족하다. 오래 꾸준히 하면 후회가 없다.", "인간관계": "중심에 섰어도 안 따르는 사람이 있다. 오래 진심을 보이면 풀린다.", "금전": "자리는 잡았어도 신뢰가 덜하다. 오래 곧게 가면 후회가 없다.", "건강": "기반은 잡았어도 아직 불안하다. 오래 꾸준하면 후회가 없다."}, {"no": 45, "name": "澤地萃 (택지췌)", "hexa": "䷬", "yao": 6, "yaoLabel": "육효", "headline": "탄식하고 눈물 콧물 흘리나, 허물은 없다.", "효사": "齎咨涕洟 无咎", "효位": "맨 위·끝 / 끝내 어울리지 못해 슬프나, 뉘우치면 무탈한 자리", "연애": "끝내 끼지 못해 슬프다. 그러나 진심으로 반성하고 다가가면 무탈하다.", "직장": "끝내 어울리지 못해 힘들다. 그러나 자세를 돌아보면 무탈하다.", "학업": "끝내 못 껴 서럽다. 그러나 돌아보고 다시 다가가면 무탈하다.", "인간관계": "끝내 어울리지 못해 슬프다. 그러나 진심으로 다가가면 무탈하다.", "금전": "끝내 흐름에 못 껴 아쉽다. 그러나 돌아보면 무탈하다.", "건강": "끝내 함께 못 해 힘들다. 그러나 돌아보면 무탈하다."}, {"no": 46, "name": "地風升 (지풍승)", "hexa": "䷭", "yao": 1, "yaoLabel": "초효", "headline": "미덥게 올라가니, 크게 길하다.", "효사": "允升 大吉", "효位": "맨 아래·시작 / 믿음을 받아 순조롭게 올라가는 자리", "연애": "믿어주는 사람이 곁에 있다. 그 신뢰를 발판 삼아 한 걸음 다가가면 크게 길하다.", "직장": "윗사람이 너를 인정한다. 그 신임을 발판 삼아 한 단계 올라서면 크게 길하다.", "학업": "기초가 탄탄하다. 그걸 발판 삼아 다음 단원으로 올라서면 크게 길하다.", "인간관계": "너를 믿는 사람이 있다. 그 신뢰로 관계를 한 단계 넓히면 크게 길하다.", "금전": "종잣돈·신용이 받쳐준다. 그걸 발판 삼아 한 단계 키우면 크게 길하다.", "건강": "기본 체력이 받쳐준다. 그걸 발판 삼아 운동을 한 단계 올리면 크게 길하다."}, {"no": 46, "name": "地風升 (지풍승)", "hexa": "䷭", "yao": 2, "yaoLabel": "이효", "headline": "진실하면 작은 정성으로도 이로우니, 허물이 없다.", "효사": "孚乃利用禴 无咎", "효位": "신하의 中 / 진실하면 꾸밈없이도 통해 허물이 없는 자리", "연애": "선물·이벤트 없이 진심만 보여도 통한다. 꾸밈없는 한마디가 마음을 연다.", "직장": "거창한 보고서 없이 핵심만 진솔하게 올려도 통한다. 진정성이면 충분하다.", "학업": "화려한 자료 없이 또박또박 푼 풀이만으로 통한다. 정직한 실력이면 된다.", "인간관계": "값비싼 선물 없이 진심 어린 안부만으로 통한다. 꾸밈없으면 무탈하다.", "금전": "큰 밑천 없이 착실한 소액 운용으로도 통한다. 원칙이면 무탈하다.", "건강": "비싼 보조제 없이 규칙적인 생활만으로 통한다. 꾸준하면 무탈하다."}, {"no": 46, "name": "地風升 (지풍승)", "hexa": "䷭", "yao": 3, "yaoLabel": "삼효", "headline": "빈 고을로 올라간다.", "효사": "升虛邑", "효位": "하괘의 끝 / 막힘 없이 거침없이 올라가는 자리", "연애": "지금은 다가가도 막힘이 없다. 망설이지 말고 먼저 연락하고 표현하라.", "직장": "지금은 추진해도 막힘이 없다. 미루던 제안·지원을 거침없이 밀어라.", "학업": "지금은 진도가 쭉쭉 나간다. 망설이지 말고 계획한 분량을 밀어붙여라.", "인간관계": "지금은 다가가도 막힘이 없다. 만나고 싶던 사람에게 거침없이 연락하라.", "금전": "지금은 운용이 술술 풀린다. 단, 어디서 멈출지 출구는 정해두고 키워라.", "건강": "지금은 활동을 늘려도 무리가 없다. 미루던 운동·도전을 거침없이 하라."}, {"no": 46, "name": "地風升 (지풍승)", "hexa": "䷭", "yao": 4, "yaoLabel": "사효", "headline": "왕이 기산에서 형통하니, 길하여 허물이 없다.", "효사": "王用亨于岐山 吉无咎", "효位": "상괘의 시작 / 정성을 다해 마땅한 자리에 오르는 자리", "연애": "정성껏 마음을 전하면 마땅한 자리에 닿는다. 진심을 다하면 길하고 탈이 없다.", "직장": "정성껏 일에 임하면 마땅한 평가가 온다. 진심을 다하면 길하고 무탈하다.", "학업": "정성껏 공부에 임하면 마땅한 결실이 온다. 진심을 다하면 길하고 무탈하다.", "인간관계": "정성껏 관계에 임하면 마땅한 신뢰가 온다. 진심을 다하면 길하고 무탈하다.", "금전": "정성껏 원칙대로 운용하면 마땅한 성과가 온다. 진심이면 길하다.", "건강": "정성껏 몸을 돌보면 마땅한 회복이 온다. 진심을 다하면 길하고 무탈하다."}, {"no": 46, "name": "地風升 (지풍승)", "hexa": "䷭", "yao": 5, "yaoLabel": "오효", "headline": "곧으면 길하니, 계단을 밟듯 올라간다.", "효사": "貞吉 升階", "효位": "임금의 자리·中 / 한 계단씩 곧게 올라 길한 자리", "연애": "한 번에 사로잡으려 말고 한 걸음씩. 데이트 한 번, 연락 하나씩 쌓으면 길하다.", "직장": "한 번에 인정받으려 말고 한 계단씩. 작은 성과를 차곡차곡 쌓으면 길하다.", "학업": "한 번에 다 올리려 말고 한 단계씩. 하루치를 꾸준히 쌓으면 길하다.", "인간관계": "한 번에 친해지려 말고 한 걸음씩. 만남을 차곡차곡 쌓으면 길하다.", "금전": "한 번에 불리려 말고 한 단계씩. 작은 수익을 차곡차곡 쌓으면 길하다.", "건강": "한 번에 좋아지려 말고 한 단계씩. 작은 습관을 차곡차곡 쌓으면 길하다."}, {"no": 46, "name": "地風升 (지풍승)", "hexa": "䷭", "yao": 6, "yaoLabel": "육효", "headline": "어두운 데로 올라가니 — 쉬지 않는 곧음이라야 이롭다.", "효사": "冥升 利于不息之貞", "효位": "맨 위·끝 / 끝없이 오르려는 집착, 멈출 줄 알아야 하는 자리", "연애": "더 깊은 사이를 끝없이 욕심내면 상대가 지친다. 어디서 만족할지 아는 게 약이다.", "직장": "더 높은 자리를 끝없이 좇으면 번아웃된다. 멈출 곳을 아는 게 약이다.", "학업": "더, 더 하며 끝없이 몰아세우면 무너진다. 충분히 했을 때 멈출 줄 알아라.", "인간관계": "더 많은 사람을 끝없이 모으려 들면 공허해진다. 멈출 곳을 아는 게 약이다.", "금전": "더 큰 수익을 끝없이 좇으면 결국 잃는다. 익절선을 아는 게 약이다.", "건강": "더 강하게 끝없이 밀어붙이면 몸이 상한다. 멈출 곳을 아는 게 약이다."}, {"no": 47, "name": "澤水困 (택수곤)", "hexa": "䷮", "yao": 1, "yaoLabel": "초효", "headline": "나무 그루터기에 앉아 곤궁하고 — 어두운 골짜기에 드니, 삼 년을 못 본다.", "효사": "臀困于株木 入于幽谷 三歲不覿", "효位": "맨 아래·시작 / 곤궁의 바닥에 빠져 스스로 갇히는 자리", "연애": "스스로 마음의 골짜기에 갇혀 연락도 끊었다. 더 움츠리면 그 사람을 영영 놓친다.", "직장": "스스로 위축돼 의견도 안 낸다. 더 움츠리면 존재감이 사라진다.", "학업": "스스로 무기력에 갇혀 책도 안 편다. 더 처지면 오래 헤맨다.", "인간관계": "스스로 마음을 닫고 사람을 피한다. 더 닫으면 외톨이가 된다.", "금전": "스스로 위축돼 아무것도 안 한다. 더 움츠리면 기회를 다 놓친다.", "건강": "스스로 무기력에 갇혀 누워만 있다. 더 처지면 더 나빠진다."}, {"no": 47, "name": "澤水困 (택수곤)", "hexa": "䷮", "yao": 2, "yaoLabel": "이효", "headline": "술과 밥에 곤궁하나 — 붉은 인끈이 바야흐로 오니, 제사를 드림이 이롭다. 나아가면 흉하나 허물은 없다.", "효사": "困于酒食 朱紱方來 利用享祀 征凶 无咎", "효位": "신하의 中 / 곤궁 속에 도움이 오기 시작하니 정성을 다할 자리", "연애": "답답해도 좋은 사람이 다가오기 시작한다. 진심을 다하되 조급히 들이대진 마라.", "직장": "어려워도 도움·기회가 오기 시작한다. 정성을 다하되 조급히 나서면 흉하다.", "학업": "막막해도 도움(인강·멘토)이 오기 시작한다. 정성을 다하되 서두르면 흉하다.", "인간관계": "곤궁해도 손 내밀 사람이 온다. 진심을 다하되 조급히 매달리진 마라.", "금전": "어려워도 기회가 오기 시작한다. 정성을 다하되 조급히 들어가면 흉하다.", "건강": "힘들어도 회복 기미가 온다. 정성껏 하되 조급히 무리하면 흉하다."}, {"no": 47, "name": "澤水困 (택수곤)", "hexa": "䷮", "yao": 3, "yaoLabel": "삼효", "headline": "돌에 곤궁하고 가시에 의지하며 — 집에 들어가도 아내를 보지 못하니, 흉하다.", "효사": "困于石 據于蒺藜 入于其宮 不見其妻 凶", "효位": "하괘의 끝·위태 / 의지할 데 없이 사방이 막혀 흉한 자리", "연애": "기댈 데 없이 막혔다. 엉뚱한 사람에게 매달리면 곁의 진짜마저 잃는다. 흉하다.", "직장": "의지할 데 없이 막혔다. 엉뚱한 줄에 매달리면 더 곤궁해진다. 흉하다.", "학업": "기댈 데 없이 막막하다. 엉뚱한 방법에 매달리면 더 헤맨다. 흉하다.", "인간관계": "기댈 데 없이 막혔다. 잘못된 사람에게 매달리면 곁마저 잃는다. 흉하다.", "금전": "의지할 데 없이 막혔다. 엉뚱한 종목에 매달리면 더 잃는다. 흉하다.", "건강": "기댈 데 없이 막혔다. 검증 안 된 방법에 매달리면 더 나빠진다. 흉하다."}, {"no": 47, "name": "澤水困 (택수곤)", "hexa": "䷮", "yao": 4, "yaoLabel": "사효", "headline": "천천히 오는 것이 쇠수레에 곤궁하니 — 부끄러우나, 끝은 있다.", "효사": "來徐徐 困于金車 吝 有終", "효位": "상괘의 시작 / 더디고 막혀 부끄러우나 끝내 풀리는 자리", "연애": "다가가는데 더디고 막혀 답답하다. 부끄러워도 끝엔 닿으니 포기하지 마라.", "직장": "도움이 더디게 와 답답하다. 부끄러워도 끝엔 풀리니 포기하지 마라.", "학업": "성적이 더디게 올라 답답하다. 부끄러워도 끝엔 풀리니 포기하지 마라.", "인간관계": "다가가는데 더디고 막힌다. 부끄러워도 끝엔 닿으니 포기하지 마라.", "금전": "흐름이 더디게 풀려 답답하다. 부끄러워도 끝엔 풀리니 포기하지 마라.", "건강": "회복이 더뎌 답답하다. 부끄러워도 끝엔 풀리니 포기하지 마라."}, {"no": 47, "name": "澤水困 (택수곤)", "hexa": "䷮", "yao": 5, "yaoLabel": "오효", "headline": "코 베이고 발 베이듯 — 붉은 인끈에 곤궁하나, 천천히 기쁨이 오니 제사 드림이 이롭다.", "효사": "劓刖 困于赤紱 乃徐有說 利用祭祀", "효位": "임금의 자리·中正 / 곤궁이 심하나 진심으로 천천히 풀려가는 자리", "연애": "위아래로 막혀 힘들다. 그러나 진심을 다하면 천천히 풀리니 조급해 말라.", "직장": "사방이 막혀 힘들다. 그러나 진심으로 임하면 천천히 풀린다. 조급해 말라.", "학업": "막막해 힘들다. 그러나 정성껏 하면 천천히 풀리니 조급해 말라.", "인간관계": "관계가 막혀 힘들다. 그러나 진심을 다하면 천천히 풀린다. 조급해 말라.", "금전": "흐름이 막혀 힘들다. 그러나 원칙을 지키면 천천히 풀린다. 조급해 말라.", "건강": "몸이 힘들다. 그러나 꾸준히 하면 천천히 회복된다. 조급해 말라."}, {"no": 47, "name": "澤水困 (택수곤)", "hexa": "䷮", "yao": 6, "yaoLabel": "육효", "headline": "칡덩굴과 위태로운 데 곤궁하니 — 뉘우치면, 가면 길하다.", "효사": "困于葛藟 于臲卼 曰動悔有悔 征吉", "효位": "맨 위·끝 / 곤궁의 끝, 뉘우치고 움직이면 풀리는 자리", "연애": "얽힌 관계에서 못 벗어나 괴롭다. 뉘우치고 한발 내디디면 풀려 길하다.", "직장": "얽매여 못 벗어난다. 자세를 바꿔 한발 움직이면 풀려 길하다.", "학업": "막힌 데서 못 벗어난다. 뉘우치고 방법을 바꿔 한발 내디디면 풀린다.", "인간관계": "얽힌 관계에서 못 벗어난다. 뉘우치고 먼저 움직이면 풀려 길하다.", "금전": "얽매여 못 벗어난다. 자세를 바꿔 한발 움직이면 풀려 길하다.", "건강": "얽혀서 못 벗어난다. 뉘우치고 한발 움직이면 풀려 길하다."}, {"no": 48, "name": "水風井 (수풍정)", "hexa": "䷯", "yao": 1, "yaoLabel": "초효", "headline": "우물에 진흙이라 먹지 못하고, 낡은 우물엔 새가 오지 않는다.", "효사": "井泥不食 舊井无禽", "효位": "맨 아래·시작 / 버려져 쓰이지 못하는, 정비가 필요한 자리", "연애": "방치된 관계는 아무도 안 찾는다. 묵힌 마음을 먼저 길어 올려 정비하라.", "직장": "낡은 방식은 아무도 안 찾는다. 묵은 걸 정비해야 다시 쓰인다.", "학업": "방치한 공부는 녹슨다. 묵은 기초부터 다시 길어 올려라.", "인간관계": "방치된 관계는 멀어진다. 먼저 연락해 묵은 정을 길어 올려라.", "금전": "방치한 자산은 죽는다. 묵은 걸 정비해야 다시 쓰인다.", "건강": "방치한 몸은 굳는다. 묵은 습관부터 정비해야 한다."}, {"no": 48, "name": "水風井 (수풍정)", "hexa": "䷯", "yao": 2, "yaoLabel": "이효", "headline": "우물 바닥에서 두레박만 새니, 붕어에게나 쏟는다.", "효사": "井谷射鮒 甕敝漏", "효位": "신하의 中이나 부정 / 좋은 자질이 새어 제대로 쓰이지 못하는 자리", "연애": "좋은 마음이 엉뚱한 데로 샌다. 진심을 맞는 사람에게 제대로 쏟아라.", "직장": "좋은 역량이 엉뚱한 데로 샌다. 핵심에 집중해 제대로 써라.", "학업": "좋은 머리가 엉뚱한 데로 샌다. 핵심 공부에 집중해 써라.", "인간관계": "좋은 마음이 엉뚱한 사람에게 샌다. 진짜에게 쏟아라.", "금전": "좋은 자본이 엉뚱한 데로 샌다. 핵심에 집중해 써라.", "건강": "좋은 기운이 엉뚱한 데로 샌다. 핵심 관리에 집중하라."}, {"no": 48, "name": "水風井 (수풍정)", "hexa": "䷯", "yao": 3, "yaoLabel": "삼효", "headline": "우물을 쳤는데도 먹지 않으니 내 마음이 슬프다 — 길어 쓸 만하니, 왕이 밝으면 함께 복을 받는다.", "효사": "井渫不食 為我心惻 可用汲 王明 並受其福", "효位": "하괘의 끝 / 능력을 갖췄으나 아직 안 쓰여 안타까운 자리", "연애": "준비됐는데 아직 알아봐 주지 않아 안타깝다. 좋은 인연을 만나면 함께 빛난다.", "직장": "실력을 갖췄는데 아직 안 쓰인다. 알아주는 사람을 만나면 함께 빛난다.", "학업": "준비됐는데 아직 결실이 없다. 좋은 기회를 만나면 함께 빛난다.", "인간관계": "진심을 갖췄는데 아직 안 닿는다. 알아주는 사람을 만나면 통한다.", "금전": "준비됐는데 아직 안 쓰인다. 좋은 흐름을 만나면 함께 빛난다.", "건강": "회복됐는데 아직 안 풀린다. 좋은 계기를 만나면 함께 좋아진다."}, {"no": 48, "name": "水風井 (수풍정)", "hexa": "䷯", "yao": 4, "yaoLabel": "사효", "headline": "우물에 벽돌을 쌓으니, 허물이 없다.", "효사": "井甃 无咎", "효位": "상괘의 시작 / 내실을 정비해 다지는 자리", "연애": "지금은 다가가기보다 자신을 가다듬을 때. 내실을 다지면 허물이 없다.", "직장": "지금은 벌이기보다 정비할 때. 내실을 다지면 허물이 없다.", "학업": "지금은 진도보다 정비할 때. 기초를 다지면 무탈하다.", "인간관계": "지금은 넓히기보다 가다듬을 때. 자신을 정비하면 무탈하다.", "금전": "지금은 키우기보다 정비할 때. 내실을 다지면 무탈하다.", "건강": "지금은 무리보다 정비할 때. 기본을 다지면 무탈하다."}, {"no": 48, "name": "水風井 (수풍정)", "hexa": "䷯", "yao": 5, "yaoLabel": "오효", "headline": "우물이 맑아 찬 샘물을 먹으니, 길하다.", "효사": "井洌寒泉食", "효位": "임금의 자리·中正 / 맑고 시원한 샘물처럼 두루 베푸는 가장 좋은 자리", "연애": "맑은 샘물처럼 진심을 두루 나눠라. 깨끗한 마음이 길하다.", "직장": "맑은 샘물처럼 실력을 두루 베풀어라. 깨끗하면 길하다.", "학업": "맑은 샘물처럼 갈고닦은 실력이 빛난다. 길하다.", "인간관계": "맑은 샘물처럼 진심을 두루 베풀어라. 깨끗하면 길하다.", "금전": "맑은 샘물처럼 건실하게 두루 쓰여라. 깨끗하면 길하다.", "건강": "맑은 샘물처럼 잘 관리된 몸이 빛난다. 길하다."}, {"no": 48, "name": "水風井 (수풍정)", "hexa": "䷯", "yao": 6, "yaoLabel": "육효", "headline": "우물을 길어 덮지 않으니 — 믿음이 있어 크게 길하다.", "효사": "井收勿幕 有孚 元吉", "효位": "맨 위·끝 / 길어 올린 것을 아낌없이 베풀어 크게 길한 자리", "연애": "길어 올린 진심을 아낌없이 나눠라. 베풀수록 크게 길하다.", "직장": "쌓은 역량을 아낌없이 베풀어라. 나눌수록 크게 길하다.", "학업": "쌓은 실력을 아낌없이 나눠라. 가르칠수록 크게 길하다.", "인간관계": "쌓은 진심을 아낌없이 나눠라. 베풀수록 크게 길하다.", "금전": "쌓은 것을 아낌없이 베풀어라. 나눌수록 크게 길하다.", "건강": "회복한 힘을 아낌없이 좋은 데 쓰라. 크게 길하다."}, {"no": 49, "name": "澤火革 (택화혁)", "hexa": "䷰", "yao": 1, "yaoLabel": "초효", "headline": "바꿀 때가 아직 아니다 — 단단히 묶어 두라.", "효사": "鞏用黃牛之革", "효位": "맨 아래 / 변혁의 충동은 이르다, 황소 가죽으로 묶듯 자제", "연애": "관계를 뒤집고 싶어도 지금은 이르다. 섣부른 변화는 탈을 부른다. 단단히 매어 두라.", "직장": "판을 갈아엎고 싶어도 때가 아니다. 명분도 힘도 아직 안 익었다. 준비를 다져라.", "학업": "공부법을 통째로 바꾸기 전에 멈춰라. 충동적 전환보다 지금 방식을 단단히 굳혀라.", "인간관계": "관계를 끊거나 뒤집을 때가 아니다. 욱하는 변화를 묶어 두면 화가 없다.", "금전": "큰 변화·갈아타기는 이르다. 지금 자리를 단단히 지키는 게 먼저다.", "건강": "갑작스런 생활 대개편은 무리. 작게 다지며 때를 기다려라."}, {"no": 49, "name": "澤火革 (택화혁)", "hexa": "䷰", "yao": 2, "yaoLabel": "이효", "headline": "무르익었다 — 이제 바꿔도 좋다.", "효사": "巳日乃革之 征吉 无咎", "효位": "신하의 中 / 때가 무르익은 뒤의 변혁, 나아가면 길", "연애": "충분히 무르익었다면 이제 관계를 한 단계 바꿔라. 때를 골랐으니 나아가도 좋다.", "직장": "준비가 익었다면 지금이 바꿀 때. 명분과 시점이 맞아 나아가면 길하다.", "학업": "방식을 바꾸기로 했다면 지금 실행하라. 충분히 고민했으니 전환이 길하다.", "인간관계": "오래 별러온 변화라면 이제 꺼내도 된다. 무르익은 말은 통한다.", "금전": "충분히 검토했다면 갈아타도 좋은 때. 때를 고른 변화는 길하다.", "건강": "미뤄온 생활 개선을 이제 시작하라. 마음먹은 때가 무르익었다."}, {"no": 49, "name": "澤火革 (택화혁)", "hexa": "䷰", "yao": 3, "yaoLabel": "삼효", "headline": "세 번 무르익어야, 그 변화는 믿음을 얻는다.", "효사": "征凶 貞厲 革言三就 有孚", "효位": "하괘의 끝·위태 / 급진은 흉, 거듭된 합의와 검증이 필요", "연애": "밀어붙이면 흉하다. 변화를 말로 거듭 확인하고 신뢰가 쌓인 뒤에 움직여라.", "직장": "혼자 급히 갈아엎으면 위태롭다. 개혁안을 세 번 다듬고 동의를 얻은 뒤 실행하라.", "학업": "한 번에 다 바꾸려다 무너진다. 검증을 거듭해 확신이 선 뒤에 전환하라.", "인간관계": "일방적 통보는 흉. 거듭 대화해 서로 신뢰가 선 뒤라야 변화가 선다.", "금전": "성급한 전환은 위태. 근거를 세 번 확인하고 확신이 설 때 움직여라.", "건강": "극단적 개편은 위험. 단계적으로 검증하며 몸이 신뢰를 보낼 때 밀어라."}, {"no": 49, "name": "澤火革 (택화혁)", "hexa": "䷰", "yao": 4, "yaoLabel": "사효", "headline": "믿음이 섰다 — 이제 판을 바꿀 때다.", "효사": "悔亡 有孚 改命 吉", "효位": "상괘의 시작·전환점 / 신뢰 위에서 명(命)을 바꿈, 길", "연애": "후회는 사라졌다. 진심이 통했다면 이제 관계의 판을 새로 짜도 길하다.", "직장": "전환점이다. 신뢰를 쌓아왔다면 과감히 방향을 바꿔라. 그 결단이 길하다.", "학업": "묵은 후회를 털 때. 확신이 섰으니 학습의 판을 새로 짜면 길하다.", "인간관계": "신뢰가 두터워졌다면 관계의 틀을 바꿔도 좋다. 변화가 길로 이어진다.", "금전": "믿을 근거가 섰다면 큰 전환을 결행하라. 후회 없이 길하다.", "건강": "그간 다져온 게 있다면 생활의 틀을 바꿀 때. 그 변화가 길하다."}, {"no": 49, "name": "澤火革 (택화혁)", "hexa": "䷰", "yao": 5, "yaoLabel": "오효", "headline": "호랑이 무늬처럼, 변화가 선명하게 드러난다.", "효사": "大人虎變 未占有孚", "효位": "임금의 자리·中正 / 대인의 당당한 변혁, 무늬가 또렷", "연애": "네 변화가 호랑이 무늬처럼 선명하다. 굳이 증명 안 해도 진심이 드러난다.", "직장": "지도자다운 결단을 당당히 내보일 때. 선명한 방향이 저절로 신뢰를 부른다.", "학업": "달라진 실력이 또렷이 드러난다. 증명하려 애쓰지 않아도 결과가 말한다.", "인간관계": "네 변화가 분명하니 사람들이 알아서 따른다. 꾸미지 않아도 믿음이 선다.", "금전": "원칙이 선명하면 굳이 점치지 않아도 길이 보인다. 당당한 결정이 통한다.", "건강": "달라진 몸이 눈에 보일 만큼 선명하다. 흔들림 없이 그 길을 가라."}, {"no": 49, "name": "澤火革 (택화혁)", "hexa": "䷰", "yao": 6, "yaoLabel": "육효", "headline": "군자는 속까지, 소인은 겉만 바꾼다.", "효사": "君子豹變 小人革面 居貞吉", "효位": "맨 위·마무리 / 변혁의 정착, 이제 머물면 길", "연애": "진짜 변한 사람과 겉만 바꾼 사람이 갈린다. 변화가 끝났으니 이제 자리를 지켜라.", "직장": "큰 변혁은 끝났다. 더 몰아붙이지 말고 정착시켜라. 머무는 것이 길하다.", "학업": "바꿀 만큼 바꿨다. 이제 흔들지 말고 다진 것을 지켜라. 안정이 길하다.", "인간관계": "누가 속까지 변했고 누가 낯빛만 바꿨는지 드러난다. 더 밀지 말고 지켜보라.", "금전": "변화는 일단락. 더 손대지 말고 자리를 지키는 것이 길하다.", "건강": "개선은 자리잡았다. 무리한 추가 변화보다 유지가 길하다."}, {"no": 50, "name": "火風鼎 (화풍정)", "hexa": "䷱", "yao": 1, "yaoLabel": "초효", "headline": "솥이 발이 뒤집히나 — 묵은 것을 쏟아내기에 이로우니, 첩을 얻어 자식을 보듯 허물이 없다.", "효사": "鼎顚趾 利出否 得妾以其子 无咎", "효位": "맨 아래·시작 / 솥을 뒤집어 묵은 찌꺼기를 비워내는 자리", "연애": "묵은 감정·낡은 관계를 비워내라. 비워야 새 인연이 들어올 자리가 생긴다.", "직장": "낡은 방식·묵은 일을 비워내라. 비워야 새것이 들어와 무탈하다.", "학업": "잘못 든 공부 습관을 비워내라. 비워야 새 방법이 채워져 무탈하다.", "인간관계": "묵은 응어리를 비워내라. 비워야 새 관계가 들어와 무탈하다.", "금전": "부실·악성을 비워내라. 비워야 건강한 자산이 들어와 무탈하다.", "건강": "나쁜 습관을 비워내라. 비워야 새 활력이 채워져 무탈하다."}, {"no": 50, "name": "火風鼎 (화풍정)", "hexa": "䷱", "yao": 2, "yaoLabel": "이효", "headline": "솥에 든 것이 있으니 — 내 짝이 병이 있어도 나에게 미치지 못하면, 길하다.", "효사": "鼎有實 我仇有疾 不我能即 吉", "효位": "신하의 中正 / 알찬 내실을 갖춰 흔들림에 휘둘리지 않는 자리", "연애": "마음에 진심이 차 있으면 흔드는 사람이 와도 안 흔들린다. 속을 채워두면 길하다.", "직장": "실력이 차 있으면 견제가 와도 못 건드린다. 내실이 있으면 길하다.", "학업": "실력이 차 있으면 유혹·방해가 와도 안 흔들린다. 채워두면 길하다.", "인간관계": "중심이 차 있으면 흔드는 사람이 와도 안 휘둘린다. 길하다.", "금전": "내실이 차 있으면 잡음이 와도 안 흔들린다. 채워두면 길하다.", "건강": "기력이 차 있으면 흔들림이 와도 버틴다. 채워두면 길하다."}, {"no": 50, "name": "火風鼎 (화풍정)", "hexa": "䷱", "yao": 3, "yaoLabel": "삼효", "headline": "솥귀가 바뀌어 그 나아감이 막히고 꿩기름을 못 먹으나 — 비가 와 뉘우침이 줄어드니, 끝내 길하다.", "효사": "鼎耳革 其行塞 雉膏不食 方雨虧悔 終吉", "효位": "하괘의 끝·위태 / 손잡이가 어긋나 막혔다 끝내 풀리는 자리", "연애": "손발이 안 맞아 막혔다. 답답해도 오해를 풀면 끝내 마음이 통한다.", "직장": "방식이 안 맞아 막혔다. 답답해도 조율하면 끝내 풀린다.", "학업": "방법이 안 맞아 막혔다. 답답해도 조정하면 끝내 풀린다.", 잃고 높은 언덕에 오르나 — 좇지 마라, 이레면 얻는다.", "효사": "震來厲 億喪貝 躋于九陵 勿逐 七日得", "효位": "신하의 中正 / 충격에 잃어도 좇지 않으면 절로 돌아오는 자리", "연애": "충격에 잃은 게 있어도 무리하게 좇지 마라. 며칠 두면 절로 돌아온다.", "직장": "변고에 잃은 게 있어도 무리하게 만회 말라. 시간을 두면 돌아온다.", "학업": "충격에 흔들려 떨어진 점수도 무리하게 따라잡지 말라. 두면 회복된다.", "인간관계": "충돌에 멀어진 사이도 무리하게 좇지 마라. 며칠 두면 돌아온다.", "금전": "악재에 잃은 것도 무리하게 만회 말라. 무리한 보복매매는 더 잃는다.", "건강": "탈로 잃은 컨디션도 무리하게 좇지 마라. 쉬면 절로 회복된다."}, {"no": 51, "name": "重雷震 (중뢰진)", "hexa": "䷲", "yao": 3, "yaoLabel": "삼효", "headline": "우레에 정신 못 차려 갈팡질팡하나 — 두려워 움직이면, 재앙이 없다.", "효사": "震蘇蘇 震行无眚", "효位": "하괘의 끝 / 놀라 허둥대나 조심해 움직이면 무탈한 자리", "연애": "충격에 갈팡질팡한다. 정신 차려 조심히 한발씩 움직이면 탈이 없다.", "직장": "변고에 허둥댄다. 정신 차려 신중히 한 가지씩 처리하면 탈이 없다.", "학업": "충격에 갈팡질팡한다. 정신 차려 차근히 한 문제씩 잡으면 무탈하다.", "인간관계": "충돌에 허둥댄다. 정신 차려 조심히 한 사람씩 풀면 무탈하다.", "금전": "악재에 갈팡질팡한다. 정신 차려 신중히 한 단계씩 대응하면 무탈하다.", "건강": "탈에 허둥댄다. 정신 차려 차근히 하나씩 챙기면 무탈하다."}, {"no": 51, "name": "重雷震 (중뢰진)", "hexa": "䷲", "yao": 4, "yaoLabel": "사효", "headline": "우레가 마침내 진흙에 빠진다.", "효사": "震遂泥", "효位": "상괘의 시작·부정 / 충격에 빠져 힘을 못 펴고 가라앉는 자리", "연애": "충격에 주저앉아 마음을 닫는다. 더 가라앉기 전에 정신을 다잡고 일어서라.", "직장": "변고에 위축돼 힘을 못 편다. 더 빠지기 전에 정신을 다잡아라.", "학업": "충격에 무기력해 못 일어난다. 더 가라앉기 전에 정신을 다잡아라.", "인간관계": "충돌에 위축돼 사람을 피한다. 더 빠지기 전에 다잡고 다가가라.", "금전": "악재에 위축돼 손을 놓는다. 더 빠지기 전에 정신을 다잡아라.", "건강": "탈에 무기력해 처진다. 더 가라앉기 전에 정신을 다잡아라."}, {"no": 51, "name": "重雷震 (중뢰진)", "hexa": "䷲", "yao": 5, "yaoLabel": "오효", "headline": "우레가 오가며 위태로우나 — 헤아려 잃지 않으면, 할 일이 있다.", "효사": "震往來厲 億无喪 有事", "효位": "임금의 자리·中 / 거듭된 충격에도 중심을 지켜 할 일을 해내는 자리", "연애": "충격이 거듭 와도 중심만 지키면 그 사람을 잃지 않는다. 할 도리를 다하라.", "직장": "변고가 거듭 와도 중심을 지키면 자리를 잃지 않는다. 본분을 다하라.", "학업": "시련이 거듭 와도 중심을 지키면 무너지지 않는다. 할 공부를 이어가라.", "인간관계": "충돌이 거듭 와도 중심을 지키면 관계를 잃지 않는다. 진심을 지켜라.", "금전": "악재가 거듭 와도 중심을 지키면 잃지 않는다. 원칙대로 대응하라.", "건강": "탈이 거듭 와도 중심을 지키면 무너지지 않는다. 관리를 이어가라."}, {"no": 51, "name": "重雷震 (중뢰진)", "hexa": "䷲", "yao": 6, "yaoLabel": "육효", "headline": "우레에 넋이 나가 두리번거리니 — 나아가면 흉하다. 제 몸 아닌 이웃에 미치면, 허물이 없다.", "효사": "震索索 視矍矍 征凶 震不于其躬于其鄰 无咎", "효位": "맨 위·끝 / 충격이 극에 달해 넋 나갔으나 미리 경계하면 무탈한 자리", "연애": "충격에 넋이 나갔다. 지금 들이대면 흉하다. 남의 연애사에서 미리 배워 대비하라.", "직장": "충격에 넋이 나갔다. 지금 강행하면 흉하다. 남의 실패에서 미리 배워라.", "학업": "충격에 넋이 나갔다. 지금 무리하면 흉하다. 남의 사례에서 미리 배워라.", "인간관계": "충격에 넋이 나갔다. 지금 다가가면 흉하다. 남의 일에서 미리 배워라.", "금전": "충격에 넋이 나갔다. 지금 진입하면 흉하다. 남의 손실에서 미리 배워라.", "건강": "충격에 넋이 나갔다. 지금 무리하면 흉하다. 남의 사례에서 미리 배워라."}, {"no": 52, "name": "重山艮 (중산간)", "hexa": "䷳", "yao": 1, "yaoLabel": "초효", "headline": "막 움직이려는 발을 멈춘다.", "효사": "艮其趾 无咎 利永貞", "효位": "맨 아래·발꿈치 / 일이 벌어지기 전의 멈춤", "연애": "마음이 막 동할 때 멈춘다. 시작도 전에 앞서지 않으면 길게 간다.", "직장": "첫발을 떼기 전 멈춰 점검할 때. 서두르지 않은 것이 허물이 안 된다.", "학업": "진도 빼기 전 기초에서 한 번 멈춰라. 처음이 단단하면 끝까지 곧다.", "인간관계": "관계의 초입, 들이대지 마라. 천천히가 오래간다.", "금전": "지출이 시작되기 전에 멈춘다. 첫 단추를 신중히.", "건강": "증상이 미미할 때 쉰다. 초기에 멈추는 게 가장 싸게 먹힌다."}, {"no": 52, "name": "重山艮 (중산간)", "hexa": "䷳", "yao": 2, "yaoLabel": "이효", "headline": "멈춰야 하는데 마음은 아직 달린다.", "효사": "艮其腓 不拯其隨 其心不快", "효位": "장딴지 / 따라가려는데 못 가 마음만 앞섬", "연애": "멈춰야 하는데 마음은 달린다. 답답해도 오늘은 억지로 끌지 마라.", "직장": "윗선은 멈췄는데 내 마음만 앞선다. 혼자 밀어붙이면 불쾌만 남는다.", "학업": "더 나가고 싶은데 흐름이 멈춰 있다. 조급함이 집중을 깨뜨린다.", "인간관계": "상대를 끌고 가고 싶어도 따라올 준비가 안 됐다. 급하면 둘 다 지친다.", "금전": "들어가고 싶은 자리가 멈춰 있다. 못 들어가 답답해도 무리하면 손해.", "건강": "더 움직이고 싶어도 몸이 멈춰 있다. 마음과 몸의 속도차를 인정하라."}, {"no": 52, "name": "重山艮 (중산간)", "hexa": "䷳", "yao": 3, "yaoLabel": "삼효", "headline": "억지로 끊으면, 속이 탄다.", "효사": "艮其限 列其夤 厲薰心", "효位": "허리·상하 단절 / 억지로 끊어 위태로움이 속을 태움", "연애": "억지로 끊으려다 속만 탄다. 무리하게 자르면 마음이 찢어진다.", "직장": "위아래를 강제로 단절시키면 위태롭다. 강경하게 끊는 것이 화를 키운다.", "학업": "억지로 끊어내듯 몰아붙이면 번아웃. 단절이 아니라 조절이 필요하다.", "인간관계": "관계를 칼같이 자르려 하면 후유증이 속을 태운다. 끊되 태우지 마라.", "금전": "손절을 억지로 하면 더 큰 동요. 끊는 것도 때와 방식이 있다.", "건강": "무리하게 참고 끊으면 속병이 된다. 강제로 누른 것이 가장 위험하다."}, {"no": 52, "name": "重山艮 (중산간)", "hexa": "䷳", "yao": 4, "yaoLabel": "사효", "headline": "남이 아니라 나를 멈춘다.", "효사": "艮其身 无咎", "효位": "몸통 / 자기 자신을 멈추는 절제", "연애": "남이 아니라 나를 멈춘다. 내 욕심을 다스리면 허물이 없다.", "직장": "남을 멈추려 말고 나부터 멈춘다. 자기 절제가 무난함을 만든다.", "학업": "외부 탓 대신 내 페이스를 멈춰 정돈한다. 스스로를 다스리면 탈이 없다.", "인간관계": "상대를 바꾸려 말고 내 반응을 멈춰라. 그것만으로 허물이 사라진다.", "금전": "시장이 아니라 내 손을 멈춘다. 충동을 멈추면 무탈하다.", "건강": "환경 탓 전에 내 생활을 멈춰 점검. 자기 관리가 곧 무사함."}, {"no": 52, "name": "重山艮 (중산간)", "hexa": "䷳", "yao": 5, "yaoLabel": "오효", "headline": "말을 멈추면, 후회가 사라진다.", "효사": "艮其輔 言有序 悔亡", "효位": "광대뼈·턱 / 말을 멈춰 질서가 서면 후회가 사라짐", "연애": "말을 멈추고 고른다. 순서 있게 말하면 후회할 일이 없다.", "직장": "입을 멈출 때. 말에 질서가 서면 후회가 사라진다.", "학업": "떠벌리기 전에 멈춰 정리. 말과 생각에 순서가 서면 흔들림이 없다.", "인간관계": "함부로 내뱉지 마라. 말을 가지런히 하면 후회가 없다.", "금전": "약속과 계약의 말을 신중히. 말에 순서가 있으면 분쟁이 없다.", "건강": "불평과 한탄을 멈춘다. 말의 절제가 마음을 가라앉힌다."}, {"no": 52, "name": "重山艮 (중산간)", "hexa": "䷳", "yao": 6, "yaoLabel": "육효", "headline": "도탑게 멈춘 자리가 끝까지 남는다.", "효사": "敦艮 吉", "효位": "맨 위 / 멈춤의 완성, 도탑게 멈춤", "연애": "멈춤이 무르익었다. 진중하게 자리를 지키면 길하다.", "직장": "끝까지 흔들림 없이 지킨 자리가 빛난다. 우직함이 길하다.", "학업": "끝까지 진득하게 다진 공부가 결실. 꾸준함이 길하다.", "인간관계": "변치 않고 곁을 지킨 신의가 길하다. 도타움이 끝에 보답받는다.", "금전": "끝까지 지킨 절제와 보수성이 길하다. 우직하게 지킨 자리가 남는다.", "건강": "꾸준히 지켜온 절제가 결실. 진득한 관리가 길하다."}, {"no": 53, "name": "風山漸 (풍산점)", "hexa": "䷴", "yao": 1, "yaoLabel": "초효", "headline": "기러기가 물가로 점점 나아가니 — 어린 자식이 위태로워 말이 있으나, 허물은 없다.", "효사": "鴻漸于干 小子厲 有言 无咎", "효位": "맨 아래·시작 / 첫걸음이 위태롭고 말이 있으나 차근히 나아가면 무탈한 자리", "연애": "첫 연락이 어색하고 주변 말도 많다. 들이대지 말고 가벼운 안부부터 천천히.", "직장": "입사·발령 초라 잡음이 있다. 조급히 나서지 말고 인수인계부터 차근히.", "학업": "새 학기·새 교재 초반이 더디다. 진도 욕심 말고 1단원부터 꼼꼼히.", "인간관계": "새 모임 초반엔 오해·뒷말이 생긴다. 서두르지 말고 한 사람씩 천천히.", "금전": "투자 첫발이라 흔들린다. 큰돈 말고 소액으로 감부터 차근히 익혀라.", "건강": "운동 첫 주가 가장 힘들다. 무리 말고 가벼운 강도부터 천천히 올려라."}, {"no": 53, "name": "風山漸 (풍산점)", "hexa": "䷴", "yao": 2, "yaoLabel": "이효", "headline": "기러기가 너럭바위로 점점 나아가니 — 먹고 마심이 즐거워, 길하다.", "효사": "鴻漸于磐 飲食衎衎 吉", "효位": "신하의 中正 / 안정된 바탕에서 여유롭게 나아가 길한 자리", "연애": "안정된 사이에서 여유롭게 한 걸음씩. 같이 밥 먹고 웃는 시간이 쌓이면 길하다.", "직장": "자리가 잡혀 여유가 생겼다. 안정된 바탕에서 한 단계씩 넓히면 길하다.", "학업": "기초가 잡혀 공부가 편해졌다. 이 리듬으로 한 단원씩 올리면 길하다.", "인간관계": "편한 사이가 됐다. 무리 없이 만남을 한 번씩 늘려가면 길하다.", "금전": "수익이 안정권이다. 무리 없이 비중을 한 단계씩 늘리면 길하다.", "건강": "컨디션이 안정됐다. 이 리듬으로 운동량을 한 단계씩 올리면 길하다."}, {"no": 53, "name": "風山漸 (풍산점)", "hexa": "䷴", "yao": 3, "yaoLabel": "삼효", "headline": "기러기가 뭍으로 점점 나아가니 — 남편이 가면 돌아오지 않고 아내가 잉태해도 못 기르니 흉하나,  "name": "風水渙 (풍수환)", "hexa": "䷺", "yao": 2, "yaoLabel": "이효", "headline": "흩어질 때 그 책상으로 달려가니, 후회가 사라진다.", "효사": "渙奔其機 悔亡", "효位": "신하의 中 / 흩어질 때 의지할 곳으로 달려가 안정하는 자리", "연애": "마음이 흔들릴 때 기댈 사람에게 다가가라. 의지할 곳을 찾으면 후회가 없다.", "직장": "흔들릴 때 믿을 기반·멘토에게 달려가라. 중심을 잡으면 후회가 없다.", "학업": "흔들릴 때 기본 개념으로 돌아가라. 중심을 다시 잡으면 후회가 없다.", "인간관계": "흔들릴 때 진짜 편인 사람에게 다가가라. 의지처를 찾으면 후회가 없다.", "금전": "흔들릴 때 안전 자산으로 옮겨라. 중심을 잡으면 후회가 없다.", "건강": "흔들릴 때 기본 생활로 돌아가라. 중심을 잡으면 후회가 없다."}, {"no": 59, "name": "風水渙 (풍수환)", "hexa": "䷺", "yao": 3, "yaoLabel": "삼효", "headline": "제 몸을 흩으니, 후회가 없다.", "효사": "渙其躬 无悔", "효位": "하괘의 끝 / 사사로움을 흩어버려 후회가 없는 자리", "연애": "미련·집착을 흩어버려라. 나를 비우고 다가가면 후회가 없다.", "직장": "사사로운 욕심을 흩어버려라. 자신을 비우고 일하면 후회가 없다.", "학업": "잡념을 흩어버려라. 마음을 비우고 책상에 앉으면 후회가 없다.", "인간관계": "자존심·고집을 흩어버려라. 비우고 다가가면 후회가 없다.", "금전": "욕심을 흩어버려라. 비우고 원칙대로 가면 후회가 없다.", "건강": "집착을 흩어버려라. 비우고 몸 신호에 맡기면 후회가 없다."}, {"no": 59, "name": "風水渙 (풍수환)", "hexa": "䷺", "yao": 4, "yaoLabel": "사효", "headline": "그 무리를 흩으니 크게 길하다 — 흩어 언덕을 이루니, 보통이 생각할 바가 아니다.", "효사": "渙其群 元吉 渙有丘 匪夷所思", "효位": "상괘의 시작 / 작은 패거리를 흩어 더 큰 모임을 이루는 자리", "연애": "끼리끼리 한 사람만 보지 말고 인연의 폭을 넓혀라. 작은 울타리를 넘으면 크게 길하다.", "직장": "파벌에서 벗어나 두루 협력하라. 작은 무리를 넘으면 더 큰 판이 열려 길하다.", "학업": "좁은 스터디·방식만 고집 말고 넓혀라. 울타리를 넘으면 크게 는다.", "인간관계": "끼리끼리만 어울리지 말고 넓혀라. 작은 무리를 넘으면 크게 길하다.", "금전": "좁은 종목·판만 보지 말고 넓혀라. 시야를 넓히면 큰 기회가 온다.", "건강": "한 가지 방법만 고집 말고 넓혀라. 좁은 틀을 넘으면 크게 좋아진다."}, {"no": 59, "name": "風水渙 (풍수환)", "hexa": "䷺", "yao": 5, "yaoLabel": "오효", "headline": "흩어질 때 큰 호령을 땀처럼 내리고 — 왕의 거처를 흩으니, 허물이 없다.", "효사": "渙汗其大號 渙王居 无咎", "효位": "임금의 자리·中正 / 진심 어린 호소로 흩어진 것을 다시 모으는 자리", "연애": "흩어진 마음은 진심 어린 한마디로 다시 모인다. 솔직히 표현하면 무탈하다.", "직장": "흩어진 조직은 분명한 비전 한마디로 다시 모인다. 진솔하면 무탈하다.", "학업": "흩어진 의지는 분명한 목표 하나로 다시 모인다. 분명히 세우면 무탈하다.", "인간관계": "흩어진 관계는 진심 어린 말 한마디로 다시 모인다. 솔직하면 무탈하다.", "금전": "흩어진 운용은 분명한 원칙 하나로 다시 모인다. 정하면 무탈하다.", "건강": "흩어진 생활은 분명한 결심 하나로 다시 모인다. 세우면 무탈하다."}, {"no": 59, "name": "風水渙 (풍수환)", "hexa": "䷺", "yao": 6, "yaoLabel": "육효", "headline": "그 피를 흩어 멀리 나가게 하니, 허물이 없다.", "효사": "渙其血去逖  자연스레 완급을 두면 일이 통한다.", "학업": "이 악물고 참는 절제 말고 편안한 절제를. 무리 없는 루틴이 오래 통한다.", "인간관계": "억지로 참는 절제 말고 편안한 절제를. 자연스러운 거리가 관계를 통하게 한다.", "금전": "억지로 누르는 절제 말고 편안한 절제를. 무리 없는 운용이 길게 통한다.", "건강": "이 악물고 참는 절제 말고 편안한 절제를. 무리 없는 식단이 오래 간다."}, {"no": 60, "name": "水澤節 (수택절)", "hexa": "䷻", "yao": 5, "yaoLabel": "오효", "headline": "달게 절제하니 길하여 — 가면 가상함이 있다.", "효사": "甘節 吉 往有尚", "효位": "임금의 자리·中正 / 절제를 기껍게 여겨 길한 가장 좋은 자리", "연애": "절제를 즐겁게 받아들여라. 밀당 아닌 기분 좋은 거리 두기가 길하고 가상하다.", "직장": "절제를 즐겁게 받아들여라. 기분 좋은 완급 조절이 길하고 가상하다.", "학업": "절제를 즐겁게 받아들여라. 기분 좋은 규칙적 공부가 길하고 가상하다.", "인간관계": "절제를 즐겁게 받아들여라. 기분 좋은 적당한 거리가 길하고 가상하다.", "금전": "절제를 즐겁게 받아들여라. 기분 좋은 원칙 운용이 길하고 가상하다.", "건강": "절제를 즐겁게 받아들여라. 기분 좋은 규칙적 관리가 길하고 가상하다."}, {"no": 60, "name": "水澤節 (수택절)", "hexa": "䷻", "yao": 6, "yaoLabel": "육효", "headline": "쓰디쓴 절제이니 곧으면 흉하나, 후회는 사라진다.", "효사": "苦節 貞凶 悔亡", "효位": "맨 위·끝 / 절제가 지나쳐 괴로우나 고치면 후회가 없는 자리", "연애": "너무 밀어내고 선만 그으면 숨 막혀 떠난다. 옥죄던 걸 풀면 후회가 없다.", "직장": "규율이 너무 빡빡하면 다 질식한다. 지나친 통제를 풀면 후회가 없다.", "학업": "너무 빡빡한 계획은 제풀에 지친다. 과한 압박을 풀면 후회가 없다.", "인간관계": "너무 선만 긋고 밀어내면 외로워진다. 지나친 경계를 풀면 후회가 없다.", "금전": "원칙이 너무 경직되면 기회를 다 놓친다. 과한 제약을 풀면 후회가 없다.", "건강": "관리가 너무 극단이면 몸이 상한다. 지나친 절제를 풀면 후회가 없다."}, {"no": 61, "name": "風澤中孚 (풍택중부)", "hexa": "䷼", "yao": 1, "yaoLabel": "초효", "headline": "헤아려 미더우면 길하나 — 딴 데 마음 두면, 편치 못하다.", "효사": "虞吉 有它不燕", "효位": "맨 아래·시작 / 믿음의 대상을 잘 헤아려 한곳에 두는 자리", "연애": "진심을 둘 사람을 잘 헤아려라. 한 사람에게 집중하면 길하고, 한눈팔면 불안하다.", "직장": "신뢰를 둘 곳을 잘 헤아려라. 한 곳에 집중하면 길하고, 분산하면 흔들린다.", "학업": "믿고 따를 방법을 잘 헤아려라. 한 길로 집중하면 길하고, 갈아타면 흔들린다.", "인간관계": "진심을 둘 사람을 잘 헤아려라. 한 사람에게 집중하면 길하다.", "금전": "신뢰를 둘 곳을 잘 헤아려라. 한 곳에 집중하면 길하고, 욕심내면 흔들린다.", "건강": "믿고 따를 방법을 잘 헤아려라. 한 가지로 집중하면 길하다."}, {"no": 61, "name": "風澤中孚 (풍택중부)", "hexa": "䷼", "yao": 2, "yaoLabel": "이효", "headline": "우는 학이 그늘에 있고 그 새끼가 화답하니 — 내게 좋은 술잔이 있어 너와 나누고자 한다.", "효사": "鳴鶴在陰 其子和之 我有好爵 吾與爾靡之", "효位": "신하의 中正 / 보이지 않아도 진심이 절로 공명하는 자리", "연애": "보이지 않아도 진심은 통한다. 멀리 있어도 마음이 닿으면 절로 답장이 온다.", "직장": "드러내지 않아도 성실함은 통한다. 묵묵히 하면 신뢰가 절로 알려진다.", "학업": "티 내지 않아도 꾸준함은 통한다. 조용히 하면 실력이 절로 드러난다.", "인간관계": "멀리 있어도 진심은 통한다. 마음이 닿으면 절로 화답이 온다.", "금전": "드러내지 않아도 신뢰는 통한다. 진실하면 좋은 사람이 절로 모인다.", "건강": "티 내지 않아도 꾸준함은 통한다. 조용히 하면 몸이 절로 답한다."}, {"no": 61, "name": "風澤中孚 (풍택중부)", "hexa": "䷼", "yao": 3, "yaoLabel": "삼효", "headline": "적을 만나 — 혹 북 치고 혹 그치며 혹 울고 혹 노래한다.", "효사": "得敵 或鼓或罷 或泣或歌", "효位": "하괘의 끝·부정 / 상대에 휘둘려 감정이 들쭉날쭉한 자리", "연애": "상대 기분에 일희일비한다. 마음의 중심을 네 안에 두어야 안 흔들린다.", "직장": "상황에 따라 들쭉날쭉한다. 중심을 안에 두어야 흔들리지 않는다.", "학업": "기분 따라 공부가 오락가락한다. 중심을 안에 두어야 꾸준해진다.", "인간관계": "상대에 휘둘려 일희일비한다. 중심을 안에 두어야 안 흔들린다.", "금전": "시장에 휘둘려 일희일비한다. 중심을 안에 두어야 안 흔들린다.", "건강": "기분 따라 관리가 오락가락한다. 중심을 안에 두어야 꾸준해진다."}, {"no": 61, "name": "風澤中孚 (풍택중부)", "hexa": "䷼", "yao": 4, "yaoLabel": "사효", "headline": "달이 거의 차니 — 말의 짝이 사라지면, 허물이 없다.", "효사": "月幾望 馬匹亡 无咎", "효位": "상괘의 시작 / 한쪽에 얽매인 사사로움을 끊어 위로 향하는 자리", "연애": "사사로운 짝패에 얽매이지 마라. 끼리끼리를 끊고 더 넓게 보면 무탈하다.", "직장": "사사로운 패거리를 끊어라. 공적인 데로 향하면 무탈하다.", "학업": "끼리끼리 의존을 끊어라. 더 넓은 배움으로 향하면 무탈하다.", "인간관계": "사사로운 짝패에 얽매이지 마라. 끊고 넓게 보면 무탈하다.", "금전": "사사로운 결탁을 끊어라. 공정한 판단으로 향하면 무탈하다.", "건강": "사사로운 의존을 끊어라. 스스로 서면 무탈하다."}, {"no": 61, "name": "風澤中孚 (풍택중부)", "hexa": "䷼", "yao": 5, "yaoLabel": "오효", "headline": "믿음이 묶어주듯 단단하니, 허물이 없다.", "효사": "有孚攣如 无咎", "효位": "임금의 자리·中正 / 진실한 믿음으로 사람을 단단히 묶는 자리", "연애": "네 진심이 마음을 단단히 묶는다. 믿음으로 맺으면 허물이 없다.", "직장": "네 신뢰가 사람을 단단히 묶는다. 믿음으로 이끌면 무탈하다.", "학업": "네 꾸준함이 신뢰를 단단히 묶는다. 진심이면 무탈하다.", "인간관계": "네 진심이 관계를 단단히 묶는다. 믿음으로 맺으면 무탈하다.", "금전": "네 신뢰가 관계를 단단히 묶는다. 믿음으로 맺으면 무탈하다.", "건강": "네 꾸준함이 신뢰를 단단히 묶는다. 진심이면 무탈하다."}, {"no": 61, "name": "風澤中孚 (풍택중부)", "hexa": "䷼", "yao": 6, "yaoLabel": "육효", "headline": "닭 우는 소리가 하늘로 오르니 — 곧아도 흉하다.", "효사": "翰音登于天 貞凶", "효位": "맨 위·끝 / 실속 없는 말만 높이 올라 흉한 자리", "연애": "말만 앞서고 진심이 안 받쳐주면 흉하다. 입에 발린 다짐을 경계하라.", "직장": "말만 높고 실속이 없으면 흉하다. 빈 호언장담을 경계하라.", "학업": "말만 앞서고 실천이 없으면 흉하다. 빈 다짐을 경계하라.", "인간관계": "말만 앞서고 진심이 없으면 흉하다. 빈말을 경계하라.", "금전": "말만 높고 실속이 없으면 흉하다. 빈 호언을 경계하라.", "건강": "말만 앞서고 실천이 없으면 흉하다. 빈 결심을 경계하라."}, {"no": 62, "name": "雷山小過 (뇌산소과)", "hexa": "䷽", "yao": 1, "yaoLabel": "초효", "headline": "나는 새이니 — 흉하다.", "효사": "飛鳥以凶", "효位": "맨 아래·시작 / 분수를 넘어 높이 날려다 흉한 자리", "연애": "단숨에 사로잡으려 큰 이벤트부터 벌이면 부담스러워 달아난다. 작게 다가가라.", "직장": "능력 넘는 큰 건부터 욕심내면 사고 난다. 작은 일로 신뢰부터 쌓아라.", "학업": "실력 넘는 고난도부터 덤비면 자신감만 깨진다. 쉬운 문제부터 풀어라.", "인간관계": "처음부터 깊은 사이를 바라면 부담스러워한다. 가벼운 인사부터 시작하라.", "금전": "감당 못 할 큰 베팅부터 하면 흉하다. 소액으로 감을 먼저 잡아라.", "건강": "안 하던 격한 운동부터 하면 다친다. 가벼운 산책부터 시작하라."}, {"no": 62, "name": "雷山小過 (뇌산소과)", "hexa": "䷽", "yao": 2, "yaoLabel": "이효", "headline": "할아버지를 지나쳐 할머니를 만나니 — 임금에 미치지 않고 신하를 만나면, 허물이 없다.", "효사": "過其祖 遇其妣 不及其君 遇其臣 无咎", "효位": "신하의 中正 / 지나치되 분수에 맞게 머물러 허물이 없는 자리", "연애": "윗사람만 바라보지 말고 눈높이 맞는 사람과 만나라. 분수에 맞으면 무탈하다.", "직장": "최고 윗선을 건너뛰려 말고 직속·실무자와 풀어라. 분수에 맞으면 무탈하다.", "학업": "단계를 건너뛰려 말고 지금 수준 문제에 충실하라. 분수에 맞으면 무탈하다.", "인간관계": "대단한 사람만 사귀려 말고 곁의 사람에게 잘하라. 분수에 맞으면 무탈하다.", "금전": "큰 종목만 노리지 말고 감당 가능한 선에서. 분수에 맞으면 무탈하다.", "건강": "무리한 목표만 잡지 말고 지금 할 수 있는 만큼. 분수에 맞으면 무탈하다."}, {"no": 62, "name": "雷山小過 (뇌산소과)", "hexa": "䷽", "yao": 3, "yaoLabel": "삼효", "headline": "지나치게 막지 않으면 — 좇아와 혹 해치니, 흉하다.", "효사": "弗過防之 從或戕之 凶", "효位": "하괘의 끝·위태 / 경계를 소홀히 해 화를 당하는 자리", "연애": "방심하면 작은 오해가 큰 싸움 된다. 사소한 서운함도 그때그때 단단히 풀어라.", "직장": "방심하면 작은 실수가 큰 사고 된다. 사소한 빈틈도 그때그때 단단히 막아라.", "학업": "방심하면 작은 약점이 큰 구멍 된다. 사소한 오답도 그때그때 단단히 잡아라.", "인간관계": "방심하면 작은 말실수가 큰 금 된다. 사소한 갈등도 그때그때 단단히 풀어라.", "금전": "방심하면 작은 손실이 큰 손실 된다. 사소한 위험도 그때그때 단단히 막아라.", "건강": "방심하면 작은 증상이 큰 병 된다. 사소한 신호도 그때그때 단단히 살펴라."}, {"no": 62, "name": "雷山小過 (뇌산소과)", "hexa": "䷽", "yao": 4, "yaoLabel": "사효", "headline": "허물이 없으니 — 지나치지 말고 만나라. 가면 위태로우니 반드시 경계하고, 오래 곧으려 마라.", "효사": "无咎 弗過遇之 往厲必戒 勿用永貞", "효位": "상괘의 시작 / 지나치지 않게 알맞게 처신하며 경계하는 자리", "연애": "넘치게 들이대지 말고 알맞게 다가가라. 무리하면 위태로우니 늘 한발 물러서라.", "직장": "넘치게 나서지 말고 알맞게 처신하라. 무리하면 위태로우니 늘 경계하라.", "학업": "넘치게 욕심내지 말고 알맞게 가라. 무리하면 위태로우니 늘 페이스를 지켜라.", "인간관계": "넘치게 챙기지 말고 알맞은 거리를 두라. 무리하면 위태로우니 늘 조심하라.", "금전": "넘치게 키우지 말고 알맞게 운용하라. 무리하면 위태로우니 늘 경계하라.", "건강": "넘치게 밀어붙이지 말고 알맞게 하라. 무리하면 위태로우니 늘 절제하라."}, {"no": 62, "name": "雷山小過 (뇌산소과)", "hexa": "䷽", "yao": 5, "yaoLabel": "오효", "headline": "빽빽한 구름에 비가 안 오니 — 우리 서쪽 들에서, 공이 줄로 저 구멍의 것을 잡는다.", "효사": "密雲不雨 自我西郊 公弋取彼在穴", "효位": "임금의 자리이나 음효 / 큰 뜻을 못 펴고 작은 것을 취하는 자리", "연애": "운명적 사랑은 아직 멀다. 지금은 소소한 호의·연락부터 챙기며 때를 기다려라.", "직장": "큰 성과는 아직 멀다. 지금은 눈앞의 작은 일부터 야무지게 챙겨라.", "학업": "큰 도약은 아직 멀다. 지금은 하루치 분량부터 야무지게 챙겨라.", "인간관계": "깊은 인연은 아직 멀다. 지금은 곁의 작은 정성부터 챙겨라.", "금전": "큰 수익은 아직 멀다. 지금은 작은 이익·관리부터 야무지게 챙겨라.", "건강": "극적 회복은 아직 멀다. 지금은 작은 습관부터 야무지게 챙겨라."}, {"no": 62, "name": "雷山小過 (뇌산소과)", "hexa": "䷽", "yao": 6, "yaoLabel": "육효", "headline": "만나지 못하고 지나치니 — 나는 새가 떠나가, 흉하다. 이를 재앙이라 한다.", "효사": "弗遇過之 飛鳥離之 凶 是謂災眚", "효位": "맨 위·끝 / 지나침이 극에 달해 화를 부르는 자리", "연애": "너무 멀리 가버려 상대가 부담을 느끼고 떠난다. 과한 들이댐이 화근이니 거둬라.", "직장": "너무 높이·빨리 가려다 사고 친다. 과욕·과속이 화를 부르니 속도를 거둬라.", "학업": "너무 무리하게 달리다 탈진한다. 과욕·과속이 화를 부르니 욕심을 거둬라.", "인간관계": "너무 과하게 다가가 상대가 질려 떠난다. 과함이 화를 부르니 거둬라.", "금전": "너무 멀리·크게 가다 크게 잃는다. 과욕이 화를 부르니 비중을 거둬라.", "건강": "너무 무리하게 밀다 몸이 상한다. 과함이 화를 부르니 강도를 거둬라."}, {"no": 63, "name": "水火既濟 (수화기제)", "hexa": "䷾", "yao": 1, "yaoLabel": "초효", "headline": "수레바퀴를 끌고 꼬리를 적시니, 허물이 없다.", "효사": "曳其輪 濡其尾 无咎", "효位": "맨 아래·시작 / 다 이룬 듯해도 처음엔 속도를 늦춰 신중한 자리", "연애": "잘 풀려도 처음엔 속도를 늦춰라. 들뜨지 말고 천천히 다가가면 허물이 없다.", "직장": "순조로워도 처음엔 속도를 늦춰라. 방심 말고 차근히 가면 탈이 없다.", "학업": "잘되어도 처음엔 속도를 늦춰라. 자만 말고 차근히 가면 무탈하다.", "인간관계": "잘 풀려도 처음엔 천천히. 들뜨지 말고 다가가면 허물이 없다.", "금전": "순조로워도 처음엔 속도를 늦춰라. 방심 말고 가면 무탈하다.", "건강": "좋아져도 처음엔 천천히. 방심 말고 가면 무탈하다."}, {"no": 63, "name": "水火既濟 (수화기제)", "hexa": "䷾", "yao": 2, "yaoLabel": "이효", "headline": "부인이 그 가리개를 잃으니 — 좇지 마라, 이레면 얻는다.", "효사": "婦喪其茀 勿逐 七日得", "효位": "신하의 中正 / 잃은 듯해도 좇지 않으면 절로 돌아오는 자리", "연애": "잠깐 멀어진 듯해도 무리하게 좇지 마라. 곧게 지키면 그 사람이 절로 돌아온다.", "직장": "기회를 놓친 듯해도 무리하게 만회 말라. 곧게 가면 절로 돌아온다.", "학업": "성적이 떨어진 듯해도 무리하게 따라잡지 말라. 곧게 가면 회복된다.", "인간관계": "사이가 멀어진 듯해도 무리하게 좇지 마라. 곧게 지키면 돌아온다.", "금전": "수익을 놓친 듯해도 무리하게 좇지 마라. 곧게 지키면 기회가 다시 온다.", "건강": "컨디션이 떨어진 듯해도 무리하게 좇지 마라. 곧게 가면 회복된다."}, {"no": 63, "name": "水火既濟 (수화기제)", "hexa": "䷾", "yao": 3, "yaoLabel": "삼효", "headline": "고종이 귀방을 쳐 삼 년 만에 이기니 — 소인은 쓰지 마라.", "효사": "高宗伐鬼方 三年克之 小人勿用", "효位": "하괘의 끝·위태 / 큰일을 오래 걸려 이루나 사람을 가려야 하는 자리", "연애": "오래 공들여 마음을 얻었다. 곁에 둘 사람은 됨됨이를 가려 들여라.", "직장": "오래 걸려 큰일을 해냈다. 함께할 사람은 인품을 가려 써라.", "학업": "오래 걸려 목표를 이뤘다. 함께할 환경·친구를 가려 골라라.", "인간관계": "오래 공들여 관계를 맺었다. 곁에 둘 사람은 됨됨이를 가려라.", "금전": "오래 걸려 큰 수익을 냈다. 함께할 사람·정보는 가려 들여라.", "건강": "오래 걸려 회복했다. 나쁜 습관·사람은 다시 들이지 마라."}, {"no": 63, "name": "水火既濟 (수화기제)", "hexa": "䷾", "yao": 4, "yaoLabel": "사효", "headline": "배에 물이 새어 헌 옷으로 막으니 — 종일 경계한다.", "효사": "繻有衣袽 終日戒", "효位": "상괘의 시작·위태 / 다 이룬 뒤에도 빈틈을 종일 경계하는 자리", "연애": "다 잘된 듯해도 작은 균열이 새기 시작한다. 사소한 서운함도 그날그날 메워라.", "직장": "성과를 냈어도 작은 구멍이 생긴다. 사소한 빈틈도 종일 점검해 메워라.", "학업": "잘되어도 작은 약점이 새기 시작한다. 사소한 오답도 그때그때 메워라.", "인간관계": "관계가 좋아도 작은 틈이 생긴다. 사소한 오해도 그날그날 챙겨라.", "금전": "수익이 나도 작은 구멍이 새기 시작한다. 사소한 위험도 종일 점검하라.", "건강": "좋아져도 작은 틈이 생긴다. 사소한 증상도 그때그때 챙겨라."}, {"no": 63, "name": "水火既濟 (수화기제)", "hexa": "䷾", "yao": 5, "yaoLabel": "오효", "headline": "동쪽 이웃이 소를 잡아 성대히 제사함이 — 서쪽 이웃의 검소한 제사가 복을 받음만 못하다.", "효사": "東鄰殺牛 不如西鄰之禴祭 實受其福", "효位": "임금의 자리·中正 / 성대함보다 진실함이 복을 받는 자리", "연애": "비싼 선물·화려한 이벤트보다 작은 진심이 더 큰 복이 된다. 진심이 답이다.", "직장": "성대한 형식보다 진실한 작은 정성이 더 인정받는다. 진심이 답이다.", "학업": "거창한 자료보다 진실한 작은 꾸준함이 더 결실 본다. 진심이 답이다.", "인간관계": "값비싼 선물보다 진심 어린 작은 안부가 더 복이 된다. 진심이 답이다.", "금전": "큰 규모보다 건실한 작은 운용이 더 복이 된다. 진심이 답이다.", "건강": "거창한 시도보다 작은 꾸준함이 더 복이 된다. 진심이 답이다."}, {"no": 63, "name": "水火既濟 (수화기제)", "hexa": "䷾", "yao": 6, "yaoLabel": "육효", "headline": "그 머리를 적시니, 위태롭다.", "효사": "濡其首 厲", "효位": "맨 위·끝 / 완성에 안주하다 끝내 위태로워지는 자리", "연애": "다 이뤘다고 막 굴면 머리끝까지 잠긴다. 사랑도 완성에 취하면 위태롭다.", "직장": "다 됐다고 방심하면 끝에 무너진다. 성공에 취하면 위태롭다.", "학업": "다 됐다고 놓아버리면 끝에 무너진다. 합격에 취하면 위태롭다.", "인간관계": "다 됐다고 방심하면 관계가 무너진다. 안정에 취하면 위태롭다.", "금전": "다 됐다고 방심하면 끝에 다 잃는다. 수익에 취하면 위태롭다.", "건강": "다 나았다고 방심하면 재발한다. 회복에 취하면 위태롭다."}, {"no": 64, "name": "火水未濟 (화수미제)", "hexa": "䷿", "yao": 1, "yaoLabel": "초효", "headline": "꼬리를 적시니, 부끄럽다.", "효사": "濡其尾 吝", "효位": "맨 아래·시작 / 미완의 출발에 분수 모르고 덤벼 부끄러운 자리", "연애": "아직 상대 마음도 모르는데 고백부터 들이밀면 민망해진다. 먼저 신호를 읽어라.", "직장": "준비 안 된 기획을 회의에서 덜컥 꺼내면 깨진다. 초안부터 다지고 올려라.", "학업": "기초도 없이 기출·심화부터 손대면 다 틀린다. 개념을 한 바퀴 먼저 돌려라.", "인간관계": "낯선 자리에서 다짜고짜 속을 털면 부담스러워한다. 분위기부터 보라.", "금전": "차트도 안 보고 추격 매수부터 하면 물린다. 진입가부터 정하고 들어가라.", "건강": "몸도 안 풀고 무거운 중량부터 들면 다친다. 워밍업부터 하라."}, {"no": 64, "name": "火水未濟 (화수미제)", "hexa": "䷿", "yao": 2, "yaoLabel": "이효", "headline": "수레바퀴를 끄니, 곧으면 길하다.", "효사": "曳其輪 貞吉", "효位": "신하의 中正 / 미완의 때에 속도를 늦추고 곧게 가 길한 자리", "연애": "달려가 매달리고 싶어도 한 박자 늦춰라. 연락 텀을 두는 게 곧게 가는 길이다.", "직장": "당장 밀어붙이고 싶어도 속도를 늦춰라. 단계를 밟아 보고하면 길하다.", "학업": "진도를 확 빼고 싶어도 늦춰라. 한 단원씩 곱씹어 가면 길하다.", "인간관계": "서운함을 바로 쏟고 싶어도 참아라. 하루 두고 말하면 곧고 길하다.", "금전": "지금 다 넣고 싶어도 분할로 늦춰라. 천천히 담으면 길하다.", "건강": "운동량을 확 올리고 싶어도 늦춰라. 점진적으로 늘리면 길하다."}, {"no": 64, "name": "火水未濟 (화수미제)", "hexa": "䷿", "yao": 3, "yaoLabel": "삼효", "headline": "아직 못 건넜으니 나아가면 흉하나 — 큰 강을 건넘이 이롭다.", "효사": "未濟 征凶 利涉大川", "효位": "하괘의 끝·전환 / 아직 미완이라 섣불리 가면 흉하나 결단의 때가 오는 자리", "연애": "지금 고백하면 거절당한다. 그러나 마음이 무르익으면 그땐 큰맘 먹고 다가가라.", "직장": "지금 사표·이직은 흉하다. 그러나 실력·자리가 차면 그땐 과감히 옮겨라.", "학업": "지금 상위반은 무리다. 그러나 기초가 차면 그땐 망설임 없이 도전하라.", "인간관계": "지금 먼저 손 내밀면 머쓱하다. 그러나 때가 오면 그땐 진심으로 다가가라.", "금전": "지금 진입은 흉하다. 그러나 바닥 신호가 확실하면 그땐 과감히 사라.", "건강": "지금 무리한 도전은 흉하다. 그러나 몸이 받쳐주면 그땐 강하게 밀어라."}, {"no": 64, "name": "火水未濟 (화수미제)", "hexa": "䷿", "yao": 4, "yaoLabel": "사효", "headline": "곧으면 길하여 후회가 사라지니 — 떨쳐 일어나 귀방을 치면, 삼 년 만에 큰 나라에서 상을 받는다.", "효사": "貞吉悔亡 震用伐鬼方 三年有賞于大國", "효位": "상괘의 시작·전환 / 곧음을 지켜 떨쳐 일어나 끝내 보답받는 자리", "연애": "흔들리지 말고 진심을 지켜라. 오래 공들이면 그 정성이 끝내 상대에게 닿는다.", "직장": "흔들리지 말고 곧게 밀어라. 몇 년 걸리는 일도 끝까지 가면 크게 인정받는다.", "학업": "흔들리지 말고 정진하라. 오래 걸리는 목표도 끝까지 가면 결실이 온다.", "인간관계": "흔들리지 말고 진심을 지켜라. 오래 공들인 관계가 끝내 신뢰로 보답한다.", "금전": "흔들리지 말고 원칙을 지켜라. 길게 보고 가면 끝내 크게 보답받는다.", "건강": "흔들리지 말고 꾸준히 하라. 오래 걸리는 회복도 끝까지 가면 좋아진다."}, {"no": 64, "name": "火水未濟 (화수미제)", "hexa": "䷿", "yao": 5, "yaoLabel": "오효", "headline": "곧으면 길하여 후회가 없으니 — 군자의 빛이 미더우면, 길하다.", "효사": "貞吉 无悔 君子之光 有孚 吉", "효位": "임금의 자리·中正 / 진실한 빛을 갖춰 미완을 완성으로 이끄는 자리", "연애": "네 다정함이 빛난다. 그 진심이 믿음직하면 미지근하던 사이도 끝내 이뤄진다.", "직장": "네 성실함이 빛난다. 그 일솜씨가 믿음직하면 미뤄지던 일도 끝내 풀린다.", "학업": "네 노력이 빛난다. 그 꾸준함이 쌓이면 안 오르던 성적도 끝내 오른다.", "인간관계 function getCol(){try{return JSON.parse(localStorage.getItem("ko_col")||"[]");}catch(e){return [];}}
function addCol(no){let c=getCol();if(!c.includes(no)){c.push(no);try{localStorage.setItem("ko_col",JSON.stringify(c));}catch(e){}}}
function getLog(){try{return JSON.parse(localStorage.getItem("ko_log")||"[]");}catch(e){return [];}}
function addLog(entry){let l=getLog();l.unshift(entry);try{localStorage.setItem("ko_log",JSON.stringify(l));}catch(e){}}
function clearLog(){if(confirm("점 기록을 모두 지울까요? (도감은 유지됩니다)")){try{localStorage.removeItem("ko_log");}catch(e){}renderLog();updateCounts();}}

let cat=null, pickedNo=null, yao=null, deckOrder=[];

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+id).classList.add('on');
  document.body.classList.toggle('home-bg', id==='home');   // 홈에서만 이미지 풀블리드
  ['home','collection','log'].forEach(n=>{const b=document.getElementById('nav-'+n);if(b)b.classList.toggle('on',n===id);});
  const titles={home:"오늘의 점",category:"오늘의 점",deck:"카드 뽑기",reveal:"카드 공개",dice:"효 정하기",reading:"오늘의 해석",collection:"내 도감",log:"점 기록"};
  document.getElementById('title').textContent=titles[id]||"오늘의 점";
  window.scrollTo(0,0);
}
function updateCounts(){
  document.getElementById('home-col').textContent=getCol().length+"/64";
  document.getElementById('home-log').textContent=getLog().length;
}

// ---- category ----
function buildCats(){
  document.getElementById('catgrid').innerHTML=CATS.map((c,i)=>{
    const label = c.k==='인간관계' ? '인간관계' : c.k+'운';
    const love = c.k==='연애' ? ' love' : '';
    return `<div class="catbtn${love}" onclick="pickCat(${i})">
      <div class="ring"></div>
      <div class="ico">${ICONS[c.k]||''}</div>
      <span class="n">${label}</span><span class="sub">${c.s}</span>
    </div>`;
  }).join('');
}
function goCategory(){show('category');}
function pickCat(i){cat=CATS[i];document.getElementById('deck-cat').textContent=cat.e+" "+cat.k;buildDeck();show('deck');}

// ---- deck ----
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildDeck(){
  deckOrder=shuffle([...Array(64)].map((_,i)=>i+1));
  document.getElementById('deck').innerHTML=deckOrder.map((no,idx)=>
    `<div class="cardback" onclick="pickCard(${no})"></div>`).join('');
  document.getElementById('deck').scrollLeft=0;
}
function pickCard(no){pickedNo=no;goReveal();}

// ---- reveal ----
function frontHTML(no){
  const h=HEX[no];
  return `<img src="${cardImg(no)}" alt="${h.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="ph" style="display:none"><div class="g">${h.hexa}</div><div class="nm">${pad2(no)} ${h.name}</div></div>`;
}
function goReveal(){
  const h=HEX[pickedNo];
  document.getElementById('reveal-front').innerHTML=frontHTML(pickedNo);
  const fi=document.getElementById('flipinner');fi.classList.remove('flipped');
  document.getElementById('reveal-label').style.opacity=0;
  document.getElementById('reveal-next').style.opacity=0;
  show('reveal');
  setTimeout(()=>fi.classList.add('flipped'),250);
  setTimeout(()=>{
    document.getElementById('reveal-label').innerHTML=`<div class="hexlabel-no">第 ${pad2(pickedNo)} 卦</div><div class="hexlabel-name">${h.name}</div>`;
    document.getElementById('reveal-label').style.opacity=1;
    document.getElementById('reveal-next').style.opacity=1;
  },950);
}

// ---- dice ----
const PIPMAP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawDie(n){
  let html='';for(let i=0;i<9;i++)html+=`<div class="pip${PIPMAP[n].includes(i)?' on':''}"></div>`;
  document.getElementById('die').innerHTML=html;
}
function goDice(){
  yao=null;rolling=false;rolled=false;
  const die=document.getElementById('die');
  drawDie(1);die.querySelectorAll('.pip').forEach(p=>p.classList.remove('on'));
  die.classList.remove('locked');
  document.getElementById('yaoresult').textContent='';
  document.getElementById('dice-cta').style.display='';
  document.getElementById('dice-next').style.display='none';
  show('dice');
}
let rolling=false, rolled=false;
function rollDice(){
  if(rolling||rolled)return;   // 이미 굴렸으면 다시 굴리지 못함
  rolling=true;
  const die=document.getElementById('die');die.classList.remove('rolling');void die.offsetWidth;die.classList.add('rolling');
  const iv=setInterval(()=>{drawDie(Math.floor(Math.random()*6)+1);},80);
  setTimeout(()=>{
    clearInterval(iv);rolling=false;rolled=true;   // 결과 확정 후 잠금
    yao=Math.floor(Math.random()*6)+1;drawDie(yao);
    die.classList.add('locked');
    document.getElementById('yaoresult').textContent=`${yao}효 · ${YAOLBL[yao]} — 오늘의 효가 정해졌습니다`;
    document.getElementById('dice-cta').style.display='none';
    setTimeout(goReading, 1000);   // 결과 잠깐 보여준 뒤 자동으로 해석 화면으로
  },640);
}

// ---- reading ----
function thumbHTML(no){
  const h=HEX[no];
  return `<img src="${cardImg(no)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="g" style="display:none">${h.hexa}</div>`;
}
function goReading(){
  const h=HEX[pickedNo], e=h.lines[yao];
  const saved=getCol().includes(pickedNo);
  document.getElementById('reading').innerHTML=`
    <button class="backlink" onclick="show('home')">‹ 처음으로</button>
    <div class="rd-top">
      <div class="rd-thumb">${thumbHTML(pickedNo)}</div>
      <div class="rd-meta">
        <div class="cat">${cat.e} ${cat.k}</div>
        <div class="nm">${h.name}</div>
        <div class="yao">第${pad2(pickedNo)}卦 · ${yao}효(${YAOLBL[yao]}) <span style="color:var(--gold-dim)">${e["효사"]}</span></div>
      </div>
    </div>
    <div class="headline">“${e.headline}”</div>
    <div class="pos">${e["효位"]}</div>
    <div class="rd-body"><div class="lab">${cat.e} ${cat.k}</div><div class="tx">${e[cat.k]}</div></div>
    <div class="actions">
      <button class="btn ghost" onclick="goCategory()">다시 뽑기</button>
      <button class="btn gold" id="savebtn" onclick="saveDraw()">${saved?"오늘 기록에 저장 ✦":"카드 저장 ✦"}</button>
    </div>`;
  show('reading');
}
function saveDraw(){
  const h=HEX[pickedNo], e=h.lines[yao];
  const isNew=!getCol().includes(pickedNo);
  addCol(pickedNo);
  const d=new Date();
  addLog({ts:d.getTime(),date:`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`,
    no:pickedNo,name:h.name,yao:yao,cat:cat.k,catE:cat.e,headline:e.headline});
  updateCounts();
  const n=getCol().length;
  toast(isNew?`새 카드 획득! 도감 ${n}/64 🃏`:`오늘 기록에 저장됨 📜 (도감 ${n}/64)`);
  document.getElementById('savebtn').textContent="저장됨 ✓";
}

// ---- collection ----
function renderCollection(){
  const col=getCol();
  document.getElementById('col-count').textContent=col.length+" / 64";
  let html='';
  for(let no=1;no<=64;no++){
    const h=HEX[no];
    if(col.includes(no)){
      html+=`<div class="colcard owned" onclick="openCard(${no})">
        <img src="${cardImg(no)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="gph" style="display:none">${h.hexa}</div>
        <div class="cn">${pad2(no)} ${kor(h.name)}</div></div>`;
    }else{
      html+=`<div class="colcard"><div class="lock"><div class="q">?</div><div class="n">${pad2(no)}</div></div></div>`;
    }
  }
  document.getElementById('colgrid').innerHTML=html;
}
function openCard(no){
  const h=HEX[no];
  let lines='';
  for(let y=1;y<=6;y++) lines+=`<div class="mline"><div class="ml">${YAOLBL[y]} · ${h.lines[y]["효사"]}</div><div class="mh">“${h.lines[y].headline}”</div></div>`;
  document.getElementById('mcard').innerHTML=`
    <div class="mimg"><img src="${cardImg(no)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="gph" style="display:none">${h.hexa}</div></div>
    <div class="mn">${pad2(no)} ${h.name}</div>${lines}
    <button class="mclose" onclick="closeModal()">닫기</button>`;
  document.getElementById('modal').classList.add('on');
}
function closeModal(){document.getElementById('modal').classList.remove('on');}

// ---- log ----
function renderLog(){
  const log=getLog();
  if(!log.length){document.getElementById('loglist').innerHTML='<div class="empty">아직 기록이 없어요.<br>점을 보고 카드를 저장하면 여기에 쌓입니다.</div>';return;}
  const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  document.getElementById('loglist').innerHTML=log.map(it=>{
    const p=it.date.split('-');
    return `<div class="logitem">
      <div class="d"><div class="dd">${p[2]}</div><div class="mm">${MON[(+p[1])-1]} ${p[0]}</div></div>
      <div class="info"><div class="c">${it.catE} ${it.cat}</div>
        <div class="h">“${it.headline}”</div>
        <div class="x">第${pad2(it.no)}卦 ${it.name} · ${YAOLBL[it.yao]}</div></div></div>`;
  }).join('');
}

// ---- toast ----
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}

// init
buildCats();updateCounts();drawDie(1);document.getElementById('die').querySelectorAll('.pip').forEach(p=>p.classList.remove('on'));
document.body.classList.add('home-bg');  // 첫 화면(홈) 풀블리드
</script>
